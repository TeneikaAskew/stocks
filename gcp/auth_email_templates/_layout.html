<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{SUBJECT}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f0f2f6;-webkit-text-size-adjust:100%;">
<div style="display:none;max-height:0;max-width:0;overflow:hidden;opacity:0;mso-hide:all;font-size:1px;line-height:1px;color:#f0f2f6;">{{PREHEADER}}&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f0f2f6;">
  <tr>
    <td align="center" style="padding:36px 16px 28px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:540px;">

        <!-- Brand mark: ascending bar-row + wordmark, mirrors src/components/layout/Brand.tsx -->
        <tr>
          <td style="padding:0 10px 18px;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0">
              <tr>
                <td valign="bottom" style="padding:0 2px 0 0;"><div style="width:4px;height:8px;background-color:#0072c6;border-radius:1px;font-size:0;line-height:0;">&nbsp;</div></td>
                <td valign="bottom" style="padding:0 2px 0 0;"><div style="width:4px;height:12px;background-color:#0072c6;border-radius:1px;font-size:0;line-height:0;">&nbsp;</div></td>
                <td valign="bottom" style="padding:0 10px 0 0;"><div style="width:4px;height:16px;background-color:#0072c6;border-radius:1px;font-size:0;line-height:0;">&nbsp;</div></td>
                <td valign="middle" style="font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:800;letter-spacing:2.5px;color:#1a1c20;">{{APP_NAME_UPPER}}</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Card -->
        <tr>
          <td style="background-color:#ffffff;border:1px solid #e4e7ee;border-radius:14px;padding:38px 38px 34px;font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1a1c20;">
{{CONTENT}}
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="padding:22px 10px 0;font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:19px;color:#6e7781;">
            <p style="margin:0 0 8px;">You are receiving this email because this address is used to sign in to {{APP_NAME}}, the market intelligence desk at <a href="{{APP_URL}}" style="color:#0072c6;text-decoration:none;">{{APP_HOST}}</a>.{{SUPPORT_LINE}}</p>
            <p style="margin:0;">&copy; {{YEAR}} {{APP_NAME}}</p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
