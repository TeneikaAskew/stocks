<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options Heatseeker</title>
    <link rel="stylesheet" href="css/styles-simple.css">
</head>
<body class="theme-dark">
    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <button class="metric-toggle active" data-metric="gex">⚡ NetGEX (#GEX)</button>
            <button class="metric-toggle" data-metric="vex">📊 NetVEX (#FV)</button>
            <button class="info-btn">ⓘ</button>
        </div>
        <div class="header-center">
            <select id="ticker-selector" class="ticker-selector">
                <option value="spy">SPY</option>
                <option value="qqq">QQQ</option>
                <option value="iwm">IWM</option>
            </select>
            <div class="price-display">
                <span id="current-price">$657.18</span>
                <span id="price-change" class="positive">+4.65 (+0.71%)</span>
            </div>
        </div>
        <div class="header-right">
            <button class="icon-btn">📂</button>
            <button class="icon-btn">🔍</button>
            <button class="nav-btn">‹</button>
            <button class="nav-btn">›</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div id="heatmap-container" class="heatmap-container">
            <table id="heatmap-table" class="heatmap-table">
                <thead>
                    <tr>
                        <th class="strike-header">Strike</th>
                        <!-- Date columns populated dynamically -->
                    </tr>
                </thead>
                <tbody id="heatmap-body">
                    <!-- Rows populated dynamically -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p>Loading data...</p>
    </div>

    <!-- Tooltip -->
    <div id="tooltip" class="tooltip hidden"></div>

    <!-- Scripts -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/dataLoader.js"></script>
    <script src="js/greeksCalculator.js"></script>
    <script src="js/nodeAnalyzer.js"></script>
    <script src="js/tableRenderer.js"></script>
    <script src="js/tooltipManager.js"></script>
    <script src="js/main-simple.js"></script>
</body>
</html>
