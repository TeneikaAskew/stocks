<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#0f0f1e" rx="15"/>

  <!-- Candlestick chart icon -->
  <!-- Green up candle -->
  <rect x="15" y="40" width="12" height="30" fill="#10b981"/>
  <line x1="21" y1="30" x2="21" y2="70" stroke="#10b981" stroke-width="2"/>

  <!-- Red down candle -->
  <rect x="35" y="25" width="12" height="40" fill="#ef4444"/>
  <line x1="41" y1="15" x2="41" y2="65" stroke="#ef4444" stroke-width="2"/>

  <!-- Green up candle -->
  <rect x="55" y="35" width="12" height="35" fill="#10b981"/>
  <line x1="61" y1="25" x2="61" y2="70" stroke="#10b981" stroke-width="2"/>

  <!-- Green up candle -->
  <rect x="75" y="20" width="12" height="45" fill="#10b981"/>
  <line x1="81" y1="10" x2="81" y2="65" stroke="#10b981" stroke-width="2"/>

  <!-- Chart arrow up -->
  <polyline points="10,85 30,75 50,80 70,65 90,55" fill="none" stroke="#6366f1" stroke-width="2"/>
  <circle cx="90" cy="55" r="3" fill="#6366f1"/>
</svg>
