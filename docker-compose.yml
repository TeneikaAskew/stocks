version: '3.8'

services:
  jupyter:
    build: .
    container_name: jupyter-notebook
    ports:
      - "8889:8888"
    volumes:
      - ./notebooks:/app/notebooks
      - ./data:/app/data
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''
    networks:
      - app-network

  claude-code:
    build:
      context: .
      dockerfile: Dockerfile.claude
    container_name: stocks-claude-code-image
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    environment:
      - TERM=xterm-256color
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  jupyter-data: