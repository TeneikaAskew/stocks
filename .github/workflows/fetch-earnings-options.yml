name: Fetch Earnings Options Data

on:
  schedule:
    # 9:00 AM EST (2:00 PM UTC) - Pre-market/opening
    - cron: '0 14 * * 1-5'
    # 9:35 AM EST (2:35 PM UTC) - Opening settlement
    - cron: '35 14 * * 1-5'
    # 10:00 AM EST (3:00 PM UTC) - IV normalization
    - cron: '0 15 * * 1-5'
    # 12:00 PM EST (5:00 PM UTC) - Mid-day check
    - cron: '0 17 * * 1-5'
    # 3:50 PM EST (8:50 PM UTC) - Near close
    - cron: '50 20 * * 1-5'
    # 4:30 PM EST (9:30 PM UTC) - After close
    - cron: '30 21 * * 1-5'
  workflow_dispatch:  # Allow manual triggering
    inputs:
      tickers:
        description: 'Specific tickers (space-separated, leave empty for CSV auto-load)'
        required: false
        default: ''
        type: string
      limit:
        description: 'Limit number of tickers (for testing)'
        required: false
        default: ''
        type: string

permissions:
  contents: write  # Required for git push
  issues: write    # Required for creating issues on failure
  pull-requests: write  # Required for creating PRs on failure
  actions: read    # Required for reading workflow run details
jobs:
  fetch-earnings-options:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-options-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-options-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yahooquery pandas pyarrow py_vollib numpy

    - name: Fetch earnings options data
      run: |
        ARGS=""

        # Add specific tickers if provided
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tickers }}" ]; then
          ARGS="$ARGS ${{ github.event.inputs.tickers }}"
        fi

        # Add limit if provided
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.limit }}" ]; then
          ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
        fi

        # Add skip-existing flag to avoid re-fetching same tickers
        ARGS="$ARGS --skip-existing"

        python scripts/fetch_earnings_options_daily.py $ARGS

    - name: Commit and push data with retry
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Get current date and time for commit message
        COMMIT_DATE=$(date +'%Y-%m-%d')
        COMMIT_TIME=$(date +'%H:%M')

        # Add parquet and JSON files (CSV files are large, optional)
        git add -f data/options/earnings/*.parquet 2>/dev/null || true
        git add -f data/options/earnings/*.json 2>/dev/null || true

        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        # Determine which snapshot this is based on time
        HOUR=$(date +'%H')
        if [ "$HOUR" -eq "14" ]; then
          SNAPSHOT="opening"
        elif [ "$HOUR" -eq "15" ]; then
          SNAPSHOT="IV-check"
        elif [ "$HOUR" -eq "17" ]; then
          SNAPSHOT="mid-day"
        elif [ "$HOUR" -eq "20" ]; then
          SNAPSHOT="near-close"
        elif [ "$HOUR" -eq "21" ]; then
          SNAPSHOT="after-hours"
        else
          SNAPSHOT="manual"
        fi

        git commit -m "update: Earnings options data - $COMMIT_DATE $COMMIT_TIME ($SNAPSHOT)"

        # Pull-rebase-push with retry logic to handle concurrent workflow pushes
        MAX_RETRIES=8
        RETRY_COUNT=0

        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          echo "Push attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."

          # Try to push
          if git push origin main; then
            echo "✓ Successfully pushed changes"
            exit 0
          fi

          # Push failed, try to sync with remote
          echo "Push failed, pulling latest changes with rebase..."

          # Attempt rebase
          if git pull --rebase origin main; then
            echo "✓ Rebase succeeded, will retry push"
          else
            # Rebase had conflicts
            echo "⚠️ Rebase conflict detected, attempting to resolve..."

            # For options data, prefer our version (the newer data)
            git checkout --ours data/options/earnings/
            git add data/options/earnings/

            # Try to continue rebase
            if git rebase --continue; then
              echo "✓ Conflict resolution succeeded"
            else
              # Rebase continue failed, abort and try merge strategy
              echo "✗ Rebase resolution failed, aborting rebase..."
              git rebase --abort

              # Fallback: use merge with ours strategy
              echo "Falling back to merge strategy..."
              if git pull --no-rebase origin main -X ours; then
                echo "✓ Merge succeeded"
              else
                echo "✗ Merge also failed"
              fi
            fi
          fi

          RETRY_COUNT=$((RETRY_COUNT + 1))

          # Exponential backoff with jitter to avoid thundering herd
          BASE_WAIT=$((2 ** RETRY_COUNT))
          JITTER=$((RANDOM % 3))
          WAIT_TIME=$((BASE_WAIT + JITTER))
          echo "Waiting ${WAIT_TIME}s before retry..."
          sleep $WAIT_TIME
        done

        echo "✗ Failed to push after $MAX_RETRIES attempts"
        exit 1

  # Handle workflow failures by creating/updating issues and PRs
  handle-failure:
    needs: fetch-earnings-options
    if: failure()
    uses: ./.github/workflows/handle-workflow-failure.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read  # Required to read workflow run details and logs
    secrets:
      PR_WORKFLOW_TOKEN: ${{ secrets.PR_WORKFLOW_TOKEN }}
    with:
      workflow_name: "Earnings Options Fetch"
      failure_title: "❌ Earnings Options Fetch Failed"
      issue_labels: "workflow-failure,earnings-options,automated"
      workflow_file: "fetch-earnings-options.yml"
      run_id: ${{ github.run_id }}
      run_number: ${{ github.run_number }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      event_name: ${{ github.event_name }}
      branch: ${{ github.ref }}
      commit_sha: ${{ github.sha }}
      create_pr: true
