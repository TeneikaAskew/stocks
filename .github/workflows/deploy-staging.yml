name: Deploy staging

# One-click redeploy of trading-platform-staging (the PUBLIC, Firebase-gated
# staging service solyra talks to) from the current main, with the DB schema
# rolled forward first.
#
# Why this exists: staging drifted. The service was serving a revision old
# enough that endpoints long since merged to main (GET /api/admin/users,
# GET /api/admin/data-sources, /api/me/profile) 404'd in the app, and there
# was no way to redeploy without an operator holding local gcloud auth. This
# workflow reuses the Workload Identity Federation auth that
# refresh-architecture-docs.yml already proves out, so a redeploy is a
# workflow_dispatch away.
#
# Manual-only by design: a deploy costs a Cloud Build run and swaps the
# revision the frontend is talking to, so a human decides when. If push-to-
# main auto-deploys are ever wanted, add a `push` trigger filtered on
# platform/** and gcp/schema.sql — but that is a policy change, not a bugfix.
# Dispatch is refused on any ref but main: workflow_dispatch lets an operator
# pick a branch, and running an unreviewed branch's deploy.sh/apply_schema
# under this workflow's WIF identity would put unmerged schema and code on
# the shared DB and the public staging service (Codex, PR #983). The in-file
# guard below is the fail-loud UX rail, NOT the boundary — a write-capable
# actor could dispatch a branch whose copy of this file drops the guard. The
# enforced boundary is the WIF provider's attribute condition, which must
# include assertion.ref=='refs/heads/main' (SETUP.md §4a documents the
# condition and the update-oidc roll-forward command; it is part of the same
# one-time operator step as the role grants below).
#
# Schema apply is OPT-IN (apply_schema=true), not part of every deploy:
# gcp/schema.sql is a full-file re-apply, and BY DESIGN it drops and
# recreates the earnings_event_outcomes / earnings_ticker_lean materialized
# views WITH NO DATA (see the "IDEMPOTENCY / RE-RUNNABILITY" comment in
# gcp/schema.sql) — and staging shares trading-db with prod, so a routine
# redeploy must not empty views prod is reading (Codex, PR #983). When the
# apply does run it runs BEFORE the deploy (so the new revision never serves
# against a missing table) and is followed by executing the standing
# refresh-earnings-views Cloud Run job (baked args --mode=weekly), shrinking
# the views' empty window from "until the weekly job" to the length of one
# refresh — cancellation-safely, see the recovery step's comment.
#
# Config sources — deliberately NO new GitHub secrets:
#   * DB_USER / DB_PASS / DB_NAME / CLOUD_SQL_CONNECTION_NAME — the same
#     GitHub secrets refresh-architecture-docs.yml already uses. The schema
#     step connects from the runner via the Cloud SQL Python Connector, the
#     exact path scripts.refresh_calibration_table already takes in CI.
#   * Firebase web config + access policy (FIREBASE_API_KEY / AUTH_DOMAIN /
#     APP_ID / PROJECT_ID, AUTH_OPEN_SIGNUP, AUTH_ALLOWED_EMAILS,
#     ADMIN_EMAIL) — read off the LIVE service before deploying, because
#     platform/deploy.sh composes --set-env-vars from scratch (it REPLACES
#     the whole env set): anything not re-supplied would be silently dropped
#     from the service. The running service stays the single source of
#     truth, and nothing new is stored in GitHub. DB_PASS never transits
#     this path — it is mounted via --set-secrets and `describe` exposes
#     only the secret reference.
#
# Required GitHub secrets (all pre-existing, see SETUP.md):
#   GCP_WIF_PROVIDER, GCP_WIF_SA_EMAIL, DB_USER, DB_PASS, DB_NAME,
#   CLOUD_SQL_CONNECTION_NAME, PR_WORKFLOW_TOKEN (failure handler)
#
# Roles the WIF service account needs BEYOND the doc-refresh set (one-time,
# granted by an operator with project IAM admin — not the CI SA):
# Every entry below was proven necessary by a real failed run on 2026-09-04
# (runs #1-#13 each failed one layer deeper; #14 was the first to deploy end
# to end); do not trim without re-testing.
#   roles/cloudsql.client            schema step's connector from the runner
#   roles/cloudbuild.builds.editor   gcloud builds submit
#   roles/serviceusage.serviceUsageConsumer
#                                    also required by `gcloud builds submit`;
#                                    without it the bucket read is refused
#                                    with a misleading "forbidden from
#                                    accessing the bucket" message (run #6)
#   bucket access on gs://adept-mountain-474619-d4_cloudbuild — the submit
#                                    needs BOTH object write AND a
#                                    storage.buckets.get metadata read.
#                                    objectAdmin ALONE is not enough (verified:
#                                    it has no storage.buckets.get) and fails
#                                    identically to no grant at all, which is
#                                    what burned runs #7-#11. Two ways to
#                                    satisfy it:
#                                      - least privilege (preferred):
#                                        roles/storage.objectAdmin +
#                                        roles/storage.legacyBucketReader
#                                        (the latter is where buckets.get
#                                        lives — verified via
#                                        `gcloud iam roles describe`).
#                                        Permission-equivalent, but NOT yet
#                                        exercised end-to-end here.
#                                      - roles/storage.admin — what the live
#                                        project currently grants and what
#                                        run #12 actually proved. Broader than
#                                        needed: it also allows deleting the
#                                        bucket and editing its IAM policy, so
#                                        prefer the pair above on a fresh
#                                        setup (Codex, PR #987).
#   roles/run.admin                  deploy the service (staging is
#                                    --allow-unauthenticated, which asserts
#                                    IAM on the service) and execute the
#                                    refresh-earnings-views job
#   roles/iam.serviceAccountUser     on BOTH service accounts:
#                                    - trading-platform-svc@… — the deploy
#                                      sets the revision's runtime identity
#                                    - 28960574877-compute@developer… — the
#                                      DEFAULT CLOUD BUILD runtime SA. Cloud
#                                      Build runs the image build as this
#                                      account, so submitting a build means
#                                      acting as it; missing this fails with
#                                      "caller does not have permission to
#                                      act as service account <numeric id>"
#                                      AFTER the source tarball uploads
#                                      (run #12)
#   roles/artifactregistry.writer    on BOTH image repos (gcr.io, location
#                                    us, and trading, location us-east1) —
#                                    platform/deploy.sh now runs
#                                    `./gcp/deploy.sh pin-images --no-sweep`
#                                    before its build, which lists tags on
#                                    every package a Cloud Run job or service
#                                    runs and creates/moves inuse-* tags so
#                                    the Artifact Registry cleanup policy
#                                    never deletes a digest that is still
#                                    deployed. Reader is not enough (no
#                                    tags.create/update) and it must cover
#                                    the trading repo too (the jobs image is
#                                    inventoried as well). It fails closed:
#                                    without this grant the run stops before
#                                    building, with the failing call named.
#                                    Granted to arch-refresh-bot@ on both
#                                    repos 2026-09-07 (read back live). To
#                                    re-apply after a rebuild of the SA:
#                                      for r in "gcr.io us" "trading us-east1"; do set -- $r
#                                        gcloud artifacts repositories add-iam-policy-binding $1 --location=$2 \
#                                          --member=serviceAccount:arch-refresh-bot@adept-mountain-474619-d4.iam.gserviceaccount.com \
#                                          --role=roles/artifactregistry.writer; done
#   roles/artifactregistry.reader    on the gcr.io repo (location us) —
#                                    `gcloud run deploy` resolves the freshly
#                                    built image via
#                                    artifactregistry.repositories.downloadArtifacts.
#                                    gcr.io is Artifact Registry-backed, so
#                                    Cloud Build WRITE access does not imply
#                                    deploy-time READ; this fails only after a
#                                    successful image build (run #13)
#   roles/secretmanager.viewer       platform/deploy.sh's trading-db-pass
#                                    existence check
#
# NOT covered here — permanently operator-owned, because it needs project IAM
# admin, which the CI service account deliberately does not have:
#   SETUP_IAM=1 ./platform/deploy.sh — grants roles/firebaseauth.admin to
#   the runtime SA (Admin → Users tab) and run.invoker on the fetcher jobs
#   (Admin → Data refresh). See the header of platform/deploy.sh.
#   STATUS: already applied in this project, verified 2026-09-04 (all seven
#   allowlisted jobs checked individually). Re-run only if those grants are
#   revoked or a job is added to the allowlist — this workflow will still
#   never do it for you. As-built inventory: docs/product/09-SECURITY-AUTH.md.

on:
  workflow_dispatch:
    inputs:
      apply_schema:
        description: 'Also apply gcp/schema.sql first (drops + recreates the earnings mat views; they are refreshed right after, see workflow header).'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# Never let two deploys interleave; never cancel one mid-flight.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  GCP_PROJECT: adept-mountain-474619-d4
  REGION: us-east1
  SERVICE: trading-platform-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write   # WIF token
    steps:
      # workflow_dispatch runs on whatever ref the operator selected, and
      # checkout follows that ref. Everything below (apply_schema against the
      # shared DB, deploy.sh onto the public service) must only ever run the
      # reviewed main revision — fail loud rather than silently skip so a
      # wrong-ref dispatch is visible in the run list.
      - name: Refuse non-main refs
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::deploy-staging must be dispatched from main (got ${GITHUB_REF}); the schema and deploy scripts must be the reviewed main revision."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      # ── 1. Schema roll-forward (opt-in, see workflow header) ──────────────
      # Same connector path as the refresh_calibration_table step in
      # refresh-architecture-docs.yml, but NOT best-effort: deploying on top
      # of a failed schema apply would serve new code against missing
      # tables, so a schema failure fails the whole run (Rule 3.7 — no
      # fabricated success). python -m gcp.apply_schema exits non-zero when
      # any statement fails and logs each statement it ran.
      - name: Set up Python
        if: inputs.apply_schema == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step-level timeout (well under the job's 60): a HUNG apply then fails
      # as a step failure instead of tripping the job-level timeout, keeping
      # the recovery step below on the normal (non-cancelled) path.
      - name: Roll schema forward (gcp/schema.sql)
        id: apply
        if: inputs.apply_schema == 'true'
        timeout-minutes: 30
        env:
          CLOUD_SQL_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          pip install --quiet sqlalchemy pg8000 pandas cloud-sql-python-connector
          python -m gcp.apply_schema

      # The apply above just recreated earnings_event_outcomes and
      # earnings_ticker_lean WITH NO DATA (deliberate in gcp/schema.sql so a
      # re-apply picks up view DDL changes). Staging shares trading-db with
      # prod, whose earnings router reads these views and whose scheduled
      # refresh is only weekly — repopulate them NOW by executing the
      # standing refresh-earnings-views Cloud Run job (its baked args are
      # --mode=weekly: REFRESH of exactly these two views; see
      # gcp/deploy.sh deploy_refresh_earnings_views), so the empty window is
      # the length of one refresh instead of days.
      #
      # Recovery must not assume the apply SUCCEEDED, nor that this job dies
      # cleanly: outside ATOMIC groups gcp.apply_schema commits each
      # statement in its own transaction and keeps going after per-statement
      # errors, so a partial apply — a failed statement, an operator
      # cancellation, the apply step's timeout — is a real state (Codex,
      # PR #983). The mat-view drop→recreate span itself is one ATOMIC group
      # (single transaction, see the markers in gcp/schema.sql), so after
      # ANY interruption the views are either the old populated ones (group
      # rolled back) or the new EMPTY ones (group committed) — never absent.
      # This step repopulates the empty-committed case. Hence:
      #   * always() (not the implicit success(), not !cancelled()): the
      #     step runs after apply failure AND after a cancellation that
      #     interrupted the apply (GitHub runs always()-gated steps in a
      #     cancelled job's grace period);
      #   * a detached Cloud Run job execution rather than an in-runner
      #     refresh: `gcloud run jobs execute` creates the execution
      #     server-side in seconds, and it runs to completion on Cloud Run
      #     even if this runner is torn down while waiting — the recovery
      #     does not depend on this job surviving. --wait is reporting only.
      #   * outcome != 'skipped' scopes it to runs where the apply actually
      #     started (a cancellation before the apply has dropped nothing).
      # The apply cannot be made one big transaction instead: schema.sql
      # contains CREATE INDEX CONCURRENTLY statements, which Postgres
      # refuses inside a transaction block. The run still ends red on a
      # failed apply, and the deploy steps below keep their default
      # success() gate, so a failed apply never deploys.
      #
      # Fallback: if the job dispatch itself fails (run #1 hit exactly this —
      # PERMISSION_DENIED on run.jobs.run because the WIF SA predates the
      # roles/run.admin grant), run the same weekly refresh in-runner over
      # the Cloud SQL connector, the path the apply step above just proved
      # works. Leaving the views empty until an operator grants the role
      # would keep prod's earnings endpoints dark for days. The in-runner
      # fallback lacks the detached execution's cancellation-safety, but it
      # only runs when the dispatch already failed for a non-cancellation
      # reason — the primary path stays the detached execution.
      - name: Repopulate earnings mat views
        if: ${{ always() && inputs.apply_schema == 'true' && steps.apply.outcome != 'skipped' }}
        env:
          CLOUD_SQL_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          if ! gcloud run jobs execute refresh-earnings-views --region "${REGION}" --wait; then
            echo "::warning::refresh-earnings-views dispatch failed (grant roles/run.admin to the WIF SA — see workflow header); falling back to in-runner refresh"
            pip install --quiet sqlalchemy pg8000 pandas cloud-sql-python-connector
            python -m gcp.refresh_earnings_views --mode=weekly
          fi

      # ── 2. Read the live service's config ─────────────────────────────────
      - name: Read live service config
        run: |
          set -euo pipefail
          CFG=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format json)
          get() {
            echo "${CFG}" | jq -r --arg n "$1" \
              '.spec.template.spec.containers[0].env[]? | select(.name == $n) | .value // empty'
          }
          MISSING=""
          for N in FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_APP_ID; do
            [ -n "$(get "$N")" ] || MISSING="${MISSING} ${N}"
          done
          if [ -n "${MISSING}" ]; then
            echo "::error::live ${SERVICE} is missing${MISSING} — a firebase-mode service cannot be redeployed without its web config. Deploy once manually with the FIREBASE_* env set (see platform/deploy.sh)."
            exit 1
          fi
          # Heredoc form so values containing commas (AUTH_ALLOWED_EMAILS)
          # survive the trip through GITHUB_ENV. Absent optional keys stay
          # unset and platform/deploy.sh applies its own defaults.
          for N in FIREBASE_PROJECT_ID FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_APP_ID \
                   AUTH_OPEN_SIGNUP AUTH_ALLOWED_EMAILS ADMIN_EMAIL DB_USER DB_NAME; do
            V=$(get "$N")
            if [ -n "${V}" ]; then
              printf '%s<<GCFG_EOF\n%s\nGCFG_EOF\n' "$N" "$V" >> "$GITHUB_ENV"
            fi
          done
          echo "live config read: firebase web config + access policy captured"

      # ── 3. Build + deploy ─────────────────────────────────────────────────
      # platform/deploy.sh does both: Cloud Build (platform/cloudbuild.yaml,
      # repo-root context) then gcloud run deploy of the staging service.
      # DB_USER/DB_NAME normally come from the live service (step above);
      # the GitHub secrets are the safety net in case the live service ever
      # stops carrying them in plain env.
      - name: Build and deploy trading-platform-staging
        env:
          DB_USER: ${{ env.DB_USER || secrets.DB_USER }}
          DB_NAME: ${{ env.DB_NAME || secrets.DB_NAME }}
        run: STAGING_SERVICE=1 ./platform/deploy.sh

      # ── 4. Smoke check ────────────────────────────────────────────────────
      # gcloud run deploy already fails the run if the revision never goes
      # ready; this adds an end-to-end probe through the public URL. Only
      # /api/health is open (api/auth._OPEN_API_PREFIXES) — gated routes
      # 401 without a Firebase token whether or not they exist, so health is
      # the strongest unauthenticated signal available.
      - name: Smoke-check the deployed revision
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format 'value(status.url)')
          REV=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format 'value(status.latestReadyRevisionName)')
          CODE=$(curl -sS -o /tmp/health.json -w '%{http_code}' "${URL}/api/health")
          cat /tmp/health.json; echo
          if [ "${CODE}" != "200" ]; then
            echo "::error::${URL}/api/health returned ${CODE} on revision ${REV}"
            exit 1
          fi
          echo "::notice::deployed ${REV} — ${URL}/api/health is 200"

  # Standard failure handler (CLAUDE.md "Automated Workflow Failure
  # Handling"). create_pr=false: a failed deploy is an IAM/infra condition
  # to act on, not a code change a draft PR could hold.
  handle-failure:
    needs: deploy
    if: failure()
    uses: ./.github/workflows/handle-workflow-failure.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    secrets:
      PR_WORKFLOW_TOKEN: ${{ secrets.PR_WORKFLOW_TOKEN }}
    with:
      workflow_name: "Deploy staging"
      failure_title: "❌ Staging deploy failed"
      issue_labels: "workflow-failure,deploy-staging,automated"
      workflow_file: "deploy-staging.yml"
      run_id: ${{ github.run_id }}
      run_number: ${{ github.run_number }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      event_name: ${{ github.event_name }}
      branch: ${{ github.ref }}
      commit_sha: ${{ github.sha }}
      create_pr: false
