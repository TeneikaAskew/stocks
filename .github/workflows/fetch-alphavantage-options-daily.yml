name: Fetch Daily Alpha Vantage Options Data

# Writes AlphaVantage HISTORICAL_OPTIONS to Cloud SQL (etf_options_snapshots
# table, data_source='alphavantage') and to GCS (raw parquet copies).
#
# Required repository secrets:
#   ALPHA_VANTAGE_API_KEY              AlphaVantage API key (premium plan, 150 RPM)
#   CLAUDE_CODE_WEB_GCP_SA_KEY         JSON of a service account with roles:
#                                       - Cloud SQL Client
#                                       - Storage Object Admin (GCS bucket)
#                                      (2026-05-10: consolidated from the
#                                      historical GCP_SA_KEY split)
#   CLOUD_SQL_CONNECTION_NAME    e.g. project:region:instance
#   DB_USER                      PostgreSQL user
#   DB_PASS                      PostgreSQL password
#   DB_NAME                      PostgreSQL database name
#   GCS_BUCKET                   GCS bucket name (no gs:// prefix)
#
# Ingests yesterday's EOD chain by default; date range can be overridden
# via workflow_dispatch for manual backfills.

on:
  schedule:
    # 01:00 UTC Mon–Fri (≈ 21:00 EDT / 20:00 EST) — after AV has published EOD.
    - cron: '0 1 * * 1-5'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Backfill start (YYYY-MM-DD). Empty = yesterday.'
        required: false
        default: ''
        type: string
      end_date:
        description: 'Backfill end (YYYY-MM-DD). Empty = yesterday.'
        required: false
        default: ''
        type: string
      tickers:
        description: 'Space-separated tickers or ALL'
        required: false
        default: 'ALL'
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  fetch-options-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-av-options-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-av-options-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'cloud-sql-python-connector[pg8000]' google-cloud-storage

      - name: Write GCP service account key
        env:
          # 2026-05-10: consolidated on CLAUDE_CODE_WEB_GCP_SA_KEY.
          GCP_SA_KEY: ${{ secrets.CLAUDE_CODE_WEB_GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::CLAUDE_CODE_WEB_GCP_SA_KEY secret is not set. Configure it in repo settings."
            exit 1
          fi
          echo "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Resolve backfill date range
        id: dates
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            START="${{ github.event.inputs.start_date }}"
            END="${{ github.event.inputs.end_date }}"
          fi
          START="${START:-$(date -u -d 'yesterday' +%Y-%m-%d)}"
          END="${END:-$(date -u -d 'yesterday' +%Y-%m-%d)}"
          echo "START_DATE=$START" >> $GITHUB_OUTPUT
          echo "END_DATE=$END" >> $GITHUB_OUTPUT
          echo "Fetching AV options $START → $END"

      - name: Fetch AlphaVantage options → Cloud SQL + GCS
        env:
          AV_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          CLOUD_SQL_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        run: |
          for var in AV_API_KEY CLOUD_SQL_CONNECTION_NAME DB_USER DB_PASS DB_NAME GCS_BUCKET; do
            if [ -z "${!var}" ]; then
              echo "::error::$var secret is not set"
              exit 1
            fi
          done

          python -m gcp.fetchers.fetch_av_historical_options \
            --tickers "${{ github.event.inputs.tickers || 'ALL' }}" \
            --start-date "${{ steps.dates.outputs.START_DATE }}" \
            --end-date   "${{ steps.dates.outputs.END_DATE }}"

  handle-failure:
    needs: fetch-options-data
    if: failure()
    uses: ./.github/workflows/handle-workflow-failure.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    secrets:
      PR_WORKFLOW_TOKEN: ${{ secrets.PR_WORKFLOW_TOKEN }}
    with:
      workflow_name: "Alpha Vantage Options Data (Daily)"
      failure_title: "❌ Alpha Vantage Daily Options Data Fetch Failed"
      issue_labels: "workflow-failure,alpha-vantage,options-data,automated"
      workflow_file: "fetch-alphavantage-options-daily.yml"
      run_id: ${{ github.run_id }}
      run_number: ${{ github.run_number }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      event_name: ${{ github.event_name }}
      branch: ${{ github.ref }}
      commit_sha: ${{ github.sha }}
      create_pr: true
