name: spec-gate
# pull_request_target, not pull_request, for the gate: GitHub takes this workflow
# file and the checked-out scripts/gate/ from the BASE branch, so a pull request
# cannot edit the check that judges it. Its own changes to the gate apply only
# after merge. The PR head is fetched as git objects and read with `git show`;
# nothing from the PR is checked out or executed, and the token is read-only.
#
# A verdict is attached to the PR head at the time it ran, against the base of
# that moment. Nothing here re-runs when main advances, so a PR that passed
# before main superseded its spec keeps its green check. Pair this workflow with
# branch protection "Require branches to be up to date before merging" (strict
# status checks): a stale PR must then merge main first, which is a synchronize
# event, and the gate re-reads the new base before the merge button works.
#
# The model-registry check lives in registry-check.yml, on plain pull_request:
# it must run the exporter the PR ships. One workflow per trust level, so a run
# never creates a skipped twin of the other's job that branch protection could
# mistake for a passing check.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch the PR head as data
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"

      - name: Spec gate (branch, plan, approved spec, PR title and body, close-out records)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/gate/spec_gate.py --pr "$BASE_SHA" "$HEAD_SHA"

      # The BASE's suite judges the proposed gate: a PR cannot certify its gate with tests it
      # also controls (registry-check.yml runs the PR's own suite; this runs main's). The
      # proposed gate replaces the base's copy only here, after the verdict above used the
      # base's. It runs PR-controlled Python, in temporary repositories, on this workflow's
      # read-only token with no secrets. A gate change that alters a tested message lands
      # in two steps: first a test that accepts both messages, then the change.
      - name: Base suite against the proposed gate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$HEAD_SHA:scripts/gate/spec_gate.py" > scripts/gate/spec_gate.py
          python3 -m pip install --quiet pytest pyyaml
          # --noconftest: the suite is hermetic; a repository conftest may import packages this job does not install
          python3 -m pytest tests/scripts/test_spec_gate.py -q -p no:cacheprovider --noconftest

