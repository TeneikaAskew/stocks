name: spec-gate
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Spec gate (spec, plan, branch name, PR title and body; code PRs only)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git checkout -q -B "${{ github.event.pull_request.head.ref }}" HEAD
          python3 scripts/gate/spec_gate.py --pr origin/${{ github.base_ref }}
