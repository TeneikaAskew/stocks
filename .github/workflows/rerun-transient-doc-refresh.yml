name: Re-run a doc refresh that died on a Vertex transport stall

# Run 20 of the monthly refresh (2026-09-07) died at
# "Regenerate 05-c-DATA_DEPENDENCIES.md" after 6m45s of silence:
#
#   Error when talking to Gemini API ... TypeError: terminated
#     [cause]: BodyTimeoutError: Body Timeout Error  code: 'UND_ERR_BODY_TIMEOUT'
#   An unexpected critical error occurred:[object Object]
#
# The Vertex streaming response body stalled and the Gemini CLI exits 1.
# Confirmed transient: run 19 ran that identical prompt against that identical
# file 20 minutes earlier in 28 seconds, and run 21 completed the same step in
# 6m01s. One vendor blip cost a 13-minute run, and on the 1st of the month it
# would cost the whole unattended refresh.
#
# WHY THE RE-RUN LIVES HERE AND NOT INSIDE THE REFRESH JOB
#
# An in-job retry was tried first (PR #1032) and abandoned. Retrying inside the
# job means starting a second Gemini CLI process in a workspace the model has
# already had write_file/replace over, and every guard that needs is a guard
# that can be got wrong:
#
#   * the retry must not restore a pre-render document, or it carries stale
#     marker blocks into the marker gate and loses the refresh anyway
#   * it must restore EVERY generated document, or an edit smuggled into a
#     different one survives
#   * it must refuse if the failed attempt wrote .gemini/settings.json, which
#     can define command-backed MCP servers that the fresh CLI process would
#     spawn with this job's GCP and GitHub credentials
#   * it must refuse if refresh-inputs/ changed, the one tree the stray-write
#     scan deliberately skips
#   * it must not classify on a signature appearing anywhere in the
#     transcript, because the model can read the checkout and echo one
#
# Re-running the JOB deletes that entire class rather than defending against
# it: a re-run gets a fresh checkout, so no model-written file survives into
# the attempt, and the classification below runs on a different runner reading
# the log through the API, where the model has no reach at all.
#
# BOUNDED BY CONSTRUCTION. `run_attempt == 1` means this can fire at most once
# per run and needs no state to enforce it.
#
# NOTE: the refresh workflow's own handle-failure job has already opened or
# updated its failure issue by the time this fires. A successful re-run does
# not close that issue; the issue is the record that the stall happened.
#
# `workflow_run` only registers once this file is on the default branch, so it
# cannot be exercised from a feature branch.

on:
  workflow_run:
    workflows: ["Monthly architecture doc refresh"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    # Only a failure, and only the first attempt.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run once if the failure was a Vertex transport stall
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh run view "$RUN_ID" --repo "$REPO" --log-failed > failed.log

          # A transport failure is ONE ATTRIBUTABLE CLI ERROR RECORD, matched on
          # a single line: the CLI's own emitter, the path of the report only
          # the CLI writes, and the transport cause. The log interleaves the
          # model's stdout with the CLI's stderr, so two independent greps --
          # a fatal prefix somewhere and a transport token somewhere -- can
          # both be satisfied by text the model wrote. (Codex, PR #1032.)
          #
          # The prefix alone was never the discriminator. The CLI emits it for
          # internal errors too; two real samples from this project:
          #
          #   ...gemini-client-error-<id>.json TypeError: terminated   <- transport
          #   ...gemini-client-error-<id>.json Error: Couldn't ...     <- internal
          #
          # so the cause ON THAT LINE is what separates them.
          #
          # Only the tail, because the CLI emits this last and then exits. The
          # timestamps GitHub prefixes onto log lines are stripped first so the
          # emitter can be anchored to the start of the line.
          TAIL=$(sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z //' failed.log | tail -n 40)
          RECORD='^Error when talking to Gemini API Full report available at: /tmp/gemini-client-error-[^ ]+ '
          TRANSPORT='(TypeError: terminated|ECONNRESET|socket hang up|UND_ERR_BODY_TIMEOUT|UND_ERR_HEADERS_TIMEOUT|UND_ERR_CONNECT_TIMEOUT|UND_ERR_SOCKET)'

          if printf '%s\n' "$TAIL" | grep -qE "${RECORD}${TRANSPORT}"; then
            CAUSE=$(printf '%s\n' "$TAIL" | grep -oE "${RECORD}${TRANSPORT}" | grep -oE "$TRANSPORT" | sort -u | tr '\n' ' ')
            echo "::notice::run ${RUN_ID} died on a Vertex transport stall (${CAUSE}); re-running the failed jobs once"
            gh api --method POST "repos/${REPO}/actions/runs/${RUN_ID}/rerun-failed-jobs"
            {
              echo "### Re-ran the monthly doc refresh"
              echo
              echo "Run \`${RUN_ID}\` failed with a Vertex transport stall (\`${CAUSE}\`)."
              echo "Re-running the failed jobs once, from a fresh checkout."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run ${RUN_ID} failed, but not with an attributable CLI transport-error record in the last 40 lines of the failed step. Leaving it red — this is the repo's own failure and the gates are supposed to catch it."
            {
              echo "### Not re-run"
              echo
              echo "Run \`${RUN_ID}\` failed without a Vertex transport-error record."
              echo "That is a real failure, so it stays red."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
