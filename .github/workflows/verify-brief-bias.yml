name: Verify brief_bias coverage

# Weekly G.P1.10 verification — runs `scripts/analysis/verify_brief_bias.py`
# against Cloud SQL and fails the workflow if any (ticker, day) bucket has
# a NULL `brief_bias`. The standard handle-workflow-failure path turns the
# failure into a labeled GitHub issue.
#
# Track C audit 2026-05-08 / G.P1.10 verify side. The plan calls for the
# verifier to run weekly until coverage stays at 100% for 2 consecutive
# weeks, at which point the verify side closes. Cron rather than the
# operator's memory.

on:
  schedule:
    # Sunday 14:00 UTC (10:00 ET / 09:00 EST) — after the weekend-review
    # Cloud Run Job's 09:00 ET firing so the brief table reflects the
    # most recent week.
    - cron: '0 14 * * 0'
  workflow_dispatch:
    inputs:
      since:
        description: "Alert-date cutoff (YYYY-MM-DD); default 2026-05-07 (first day brief_bias was populated)"
        required: false
        default: ''

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  verify-brief-bias:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-verify-brief-bias-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-verify-brief-bias-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'cloud-sql-python-connector[pg8000]'

      - name: Write GCP service account key
        env:
          # 2026-05-10: consolidated on CLAUDE_CODE_WEB_GCP_SA_KEY.
          GCP_SA_KEY: ${{ secrets.CLAUDE_CODE_WEB_GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::CLAUDE_CODE_WEB_GCP_SA_KEY secret is not set"
            exit 1
          fi
          echo "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Run brief_bias coverage verifier
        env:
          CLOUD_SQL_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          SINCE: ${{ github.event.inputs.since }}
        run: |
          for var in CLOUD_SQL_CONNECTION_NAME DB_USER DB_PASS DB_NAME; do
            if [ -z "${!var}" ]; then
              echo "::error::$var secret is not set"
              exit 1
            fi
          done

          # Default cutoff is 2026-05-07 — the actual first day brief_bias
          # was populated, per the live-DB audit on 2026-05-09 that closed
          # PR #357 (100% coverage on 05-07 and 05-08; 0% prior). Earlier
          # docs hard-coded 2026-05-12 expecting a later fix-land; that
          # turned out to be wrong by ~5 days, and a 2026-05-12 cutoff
          # would have made the first scheduled run on 2026-05-10 open a
          # false-alarm issue (window starts in the future → exit 2).
          # Codex review on PR #366 caught this. Manual workflow_dispatch
          # can still override.
          SINCE_ARG="${SINCE:-2026-05-07}"

          mkdir -p /tmp/verify-brief-bias
          set +e
          python -m scripts.analysis.verify_brief_bias \
            --since "$SINCE_ARG" \
            --tickers SPY,IWM,QQQ \
            --output /tmp/verify-brief-bias/report.md
          AUDIT_EXIT=$?
          set -e

          echo "## brief_bias coverage verification" >> $GITHUB_STEP_SUMMARY
          cat /tmp/verify-brief-bias/report.md >> $GITHUB_STEP_SUMMARY

          # exit codes per the script:
          #   0 = PASS (every bucket has brief_bias populated)
          #   1 = FAIL (coverage hole)
          #   2 = env / DB issue (no rows pulled)
          if [ "$AUDIT_EXIT" -ne 0 ]; then
            echo "::error::verify_brief_bias exited $AUDIT_EXIT — see report above"
            exit "$AUDIT_EXIT"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-bias-coverage-${{ github.run_id }}
          path: /tmp/verify-brief-bias/report.md
          if-no-files-found: ignore

  handle-failure:
    needs: verify-brief-bias
    if: failure()
    uses: ./.github/workflows/handle-workflow-failure.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    secrets:
      PR_WORKFLOW_TOKEN: ${{ secrets.PR_WORKFLOW_TOKEN }}
    with:
      workflow_name: "Verify brief_bias coverage"
      failure_title: "❌ brief_bias coverage hole detected (G.P1.10 regression)"
      issue_labels: "workflow-failure,brief-bias,audit-2026-05-08,automated"
      workflow_file: "verify-brief-bias.yml"
      run_id: ${{ github.run_id }}
      run_number: ${{ github.run_number }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      event_name: ${{ github.event_name }}
      branch: ${{ github.ref }}
      commit_sha: ${{ github.sha }}
      create_pr: false
