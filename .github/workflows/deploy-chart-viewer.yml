name: Deploy Chart Viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'chart-viewer/**'
      - '.github/workflows/deploy-chart-viewer.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject GitHub Token into config.js
        run: |
          cd chart-viewer/src

          # Replace the empty GITHUB_TOKEN with the secret
          sed -i "s|GITHUB_TOKEN: ''|GITHUB_TOKEN: '${{ secrets.GH_TRADING_APP_KEY }}'|g" config.js

          echo "✅ Token injected into config.js"
        env:
          GH_TRADING_APP_KEY: ${{ secrets.GH_TRADING_APP_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './chart-viewer'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
