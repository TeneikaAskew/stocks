name: Deploy Trading Apps to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'chart-viewer/**'
      - 'options-heatseeker/**'
      - 'index.html'
      - '.github/workflows/deploy-chart-viewer.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install pyarrow pandas

      - name: Convert options data to JSON
        run: |
          cd options-heatseeker
          python convert_parquet_to_json.py --days 30
          echo "✅ Options data converted to JSON"
        continue-on-error: true

      - name: Prepare deployment directory
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r chart-viewer _site/
          cp -r options-heatseeker _site/
          echo "✅ Deployment directory prepared"

      - name: Inject GitHub Token into config.js
        run: |
          cd _site/chart-viewer/src

          # Replace the empty GITHUB_TOKEN with the secret
          sed -i "s|GITHUB_TOKEN: ''|GITHUB_TOKEN: '${{ secrets.GH_TRADING_APP_KEY }}'|g" config.js

          echo "✅ Token injected into config.js"
        env:
          GH_TRADING_APP_KEY: ${{ secrets.GH_TRADING_APP_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
