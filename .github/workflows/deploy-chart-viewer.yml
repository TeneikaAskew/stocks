name: Deploy Chart Viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'chart-viewer/**'
      - '.github/workflows/deploy-chart-viewer.yml'
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject GitHub Token into config.js
        run: |
          cd chart-viewer/src

          # Replace the empty GITHUB_TOKEN with the secret
          sed -i "s|GITHUB_TOKEN: ''|GITHUB_TOKEN: '${{ secrets.GH_TRADING_APP_KEY }}'|g" config.js

          echo "✅ Token injected into config.js"
          echo "Token length: ${#GH_TRADING_APP_KEY}"
        env:
          GH_TRADING_APP_KEY: ${{ secrets.GH_TRADING_APP_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './chart-viewer'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  handle-failure:
    needs: [build-and-deploy]
    if: failure()
    uses: ./.github/workflows/handle-workflow-failure.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    with:
      workflow_name: "Chart Viewer Deployment"
      failure_title: "❌ Chart Viewer GitHub Pages deployment failed"
      issue_labels: "workflow-failure,github-pages,automated"
      workflow_file: "deploy-chart-viewer.yml"
      run_id: ${{ github.run_id }}
      run_number: ${{ github.run_number }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      event_name: ${{ github.event_name }}
      branch: ${{ github.ref }}
      commit_sha: ${{ github.sha }}
      create_pr: true
