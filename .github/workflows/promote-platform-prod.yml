name: Promote Platform (Production)

# Manually routes 100% of trading-platform production traffic to the
# current `staging`-tagged Cloud Run revision. This is the promotion half
# of the two-stage deploy pipeline:
#   1. deploy-platform-staging.yml — builds + deploys a staging revision
#      (0% traffic) on every push to main.
#   2. promote-platform-prod.yml   — (this file) promotes that verified
#      staging revision to 100% production traffic.
#
# Production URL: https://stocks.insightscollective.org
# Rollback: re-run after a staging deploy of known-good code, or route
# traffic back to a prior revision directly:
#   gcloud run services update-traffic trading-platform \
#     --region=us-east1 --to-revisions=<previous-revision>=100

on:
  workflow_dispatch:

permissions:
  contents: read

# Shares the staging deploy's concurrency group so a promote and a deploy
# can never interleave — a deploy moves the `staging` tag, which would
# otherwise race a promote reading it.
concurrency:
  group: deploy-platform-staging
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Authenticate to Google Cloud
        env:
          SA_KEY: ${{ secrets.CLAUDE_CODE_WEB_GCP_SA_KEY }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "::error::CLAUDE_CODE_WEB_GCP_SA_KEY secret is not set"
            exit 1
          fi
          echo "$SA_KEY" > "$RUNNER_TEMP/gcp-key.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcp-key.json"
          gcloud config set project adept-mountain-474619-d4

      - name: Resolve the staging-tagged revision
        id: resolve
        run: |
          REV=$(gcloud run services describe trading-platform --region=us-east1 \
            --format=json \
            | python3 -c "import sys,json; t=json.load(sys.stdin)['status']['traffic']; s=[x for x in t if x.get('tag')=='staging']; print(s[0]['revisionName'] if s else '')")
          if [ -z "$REV" ]; then
            echo "::error::No 'staging'-tagged revision found. Run 'Deploy Platform (Staging)' first."
            exit 1
          fi
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "Staging-tagged revision to promote: $REV"

      - name: Show current traffic (before)
        run: |
          gcloud run services describe trading-platform --region=us-east1 \
            --format='value(status.traffic)'

      - name: Promote staging revision to 100% production traffic
        run: |
          gcloud run services update-traffic trading-platform \
            --region=us-east1 \
            --to-tags=staging=100

      - name: Summarize
        if: success()
        run: |
          {
            echo "## Production promotion complete"
            echo ""
            echo "Revision **${{ steps.resolve.outputs.revision }}** is now serving 100% of production traffic."
            echo ""
            echo "| Environment | URL |"
            echo "|---|---|"
            echo "| Production | https://stocks.insightscollective.org |"
            echo ""
            echo "### Traffic after promotion"
            echo '```'
            gcloud run services describe trading-platform --region=us-east1 \
              --format='value(status.traffic)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  handle-failure:
    needs: promote
    if: failure()
    uses: ./.github/workflows/handle-workflow-failure.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    secrets:
      PR_WORKFLOW_TOKEN: ${{ secrets.PR_WORKFLOW_TOKEN }}
    with:
      workflow_name: "Promote Platform (Production)"
      failure_title: "❌ Platform production promotion failed"
      issue_labels: "workflow-failure,deploy,automated"
      workflow_file: "promote-platform-prod.yml"
      run_id: ${{ github.run_id }}
      run_number: ${{ github.run_number }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      event_name: ${{ github.event_name }}
      branch: ${{ github.ref }}
      commit_sha: ${{ github.sha }}
      create_pr: false
