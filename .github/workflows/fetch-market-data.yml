name: Fetch Daily Market Data

on:
  schedule:
    # Run at 5:00 PM EST (10:00 PM UTC) every weekday after market close
    - cron: '0 22 * * 1-5'
  workflow_dispatch:  # Allow manual triggering
    inputs:
      tickers:
        description: 'Tickers to fetch (IWM SPY QQQ SPX or ALL)'
        required: false
        default: 'ALL'
        type: string
      date:
        description: 'Optional date to fetch data for (YYYY-MM-DD). If empty, runner date is used.'
        required: false
        default: ''
        type: string

permissions:
  contents: write  # Required for git push
  issues: write    # Required for creating issues on failure

jobs:
  fetch-market-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-market-data-${{ hashFiles('requirements-data.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-market-data-
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas pyarrow pytz
    
    - name: Determine tickers to fetch
      id: tickers
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tickers }}" ]; then
          echo "TICKERS=${{ github.event.inputs.tickers }}" >> $GITHUB_OUTPUT
        else
          echo "TICKERS=ALL" >> $GITHUB_OUTPUT
        fi

    - name: Determine date to use
      id: date
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.date }}" ]; then
          echo "DATE=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
        else
          echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        fi
    
    - name: Fetch market data
      run: |
        if [ "${{ steps.tickers.outputs.TICKERS }}" = "ALL" ]; then
          python scripts/fetch_market_data.py --tickers ALL --date ${{ steps.date.outputs.DATE }}
        else
          python scripts/fetch_market_data.py --tickers ${{ steps.tickers.outputs.TICKERS }} --date ${{ steps.date.outputs.DATE }}
        fi
    
    - name: Commit and push data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Add all parquet and json files in data directory
        git add data/*.parquet data/*.json data/*/minute/*.parquet 2>/dev/null || true

        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          # Create commit message with ticker list
          COMMIT_MSG="Update market data - ${{ steps.date.outputs.DATE }}"
          if [ "${{ steps.tickers.outputs.TICKERS }}" != "ALL" ]; then
            COMMIT_MSG="$COMMIT_MSG (${{ steps.tickers.outputs.TICKERS }})"
          fi

          git commit -m "$COMMIT_MSG"
          git push
        fi

    - name: Create issue on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const title = '❌ Market Data Fetch Failed';
          const body = `## Workflow Failed

          **Workflow:** ${context.workflow}
          **Run:** [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
          **Triggered by:** ${context.eventName}
          **Branch:** ${context.ref}
          **Commit:** ${context.sha.substring(0, 7)}
          **Time:** ${new Date().toISOString()}

          ### Error Details
          Check the [workflow logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for more details.

          ### Action Required
          Please investigate and fix the issue. This workflow runs automatically.

          ---
          *This issue was automatically created by GitHub Actions*`;

          // Check if there's already an open issue for this workflow
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: ['workflow-failure', 'market-data'],
            per_page: 1
          });

          if (issues.data.length === 0) {
            // Create new issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['workflow-failure', 'market-data', 'automated']
            });
          } else {
            // Add comment to existing issue
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issues.data[0].number,
              body: `### Additional Failure\n${body}`
            });
          }
