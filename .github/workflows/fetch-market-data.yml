name: Fetch Daily Market Data

on:
  schedule:
    # Run at 5:00 PM EST (10:00 PM UTC) every weekday after market close
    - cron: '0 22 * * 1-5'
  workflow_dispatch:  # Allow manual triggering
    inputs:
      tickers:
        description: 'Tickers to fetch (IWM SPY QQQ SPX or ALL)'
        required: false
        default: 'ALL'
        type: string
      date:
        description: 'Optional date to fetch data for (YYYY-MM-DD). If empty, runner date is used.'
        required: false
        default: ''
        type: string

permissions:
  contents: write  # Required for git push
  issues: write    # Required for creating issues on failure
  pull-requests: write  # Required for creating PRs on failure
  actions: read    # Required for reading workflow run details
jobs:
  fetch-market-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-market-data-${{ hashFiles('requirements-data.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-market-data-
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas pyarrow pytz
    
    - name: Determine tickers to fetch
      id: tickers
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tickers }}" ]; then
          echo "TICKERS=${{ github.event.inputs.tickers }}" >> $GITHUB_OUTPUT
        else
          echo "TICKERS=ALL" >> $GITHUB_OUTPUT
        fi

    - name: Determine date to use
      id: date
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.date }}" ]; then
          echo "DATE=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
        else
          echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        fi
    
    - name: Fetch market data
      run: |
        if [ "${{ steps.tickers.outputs.TICKERS }}" = "ALL" ]; then
          python scripts/fetch_market_data.py --tickers ALL --date ${{ steps.date.outputs.DATE }}
        else
          python scripts/fetch_market_data.py --tickers ${{ steps.tickers.outputs.TICKERS }} --date ${{ steps.date.outputs.DATE }}
        fi
    
    - name: Commit and push data with retry
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Add all parquet and json files in data directory
        git add data/*.parquet data/*.json data/*/minute/*.parquet 2>/dev/null || true

        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          # Create commit message with ticker list
          COMMIT_MSG="Update market data - ${{ steps.date.outputs.DATE }}"
          if [ "${{ steps.tickers.outputs.TICKERS }}" != "ALL" ]; then
            COMMIT_MSG="$COMMIT_MSG (${{ steps.tickers.outputs.TICKERS }})"
          fi

          git commit -m "$COMMIT_MSG"

          # Pull-rebase-push with retry logic to handle concurrent workflow pushes
          MAX_RETRIES=8
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Push attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."

            # Try to push
            if git push origin main; then
              echo "✓ Successfully pushed changes"
              exit 0
            fi

            # Push failed, try to sync with remote
            echo "Push failed, pulling latest changes with rebase..."

            # Attempt rebase
            if git pull --rebase origin main; then
              echo "✓ Rebase succeeded, will retry push"
            else
              # Rebase had conflicts
              echo "⚠️ Rebase conflict detected, attempting to resolve..."

              # For market data, prefer our version (the newer data)
              git checkout --ours data/
              git add data/

              # Try to continue rebase
              if git rebase --continue; then
                echo "✓ Conflict resolution succeeded"
              else
                # Rebase continue failed, abort and try merge strategy
                echo "✗ Rebase resolution failed, aborting rebase..."
                git rebase --abort

                # Fallback: use merge with ours strategy
                echo "Falling back to merge strategy..."
                if git pull --no-rebase origin main -X ours; then
                  echo "✓ Merge succeeded"
                else
                  echo "✗ Merge also failed"
                fi
              fi
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))

            # Exponential backoff with jitter to avoid thundering herd
            BASE_WAIT=$((2 ** RETRY_COUNT))
            JITTER=$((RANDOM % 3))
            WAIT_TIME=$((BASE_WAIT + JITTER))
            echo "Waiting ${WAIT_TIME}s before retry..."
            sleep $WAIT_TIME
          done

          echo "✗ Failed to push after $MAX_RETRIES attempts"
          exit 1
        fi

  # Handle workflow failures by creating/updating issues and PRs
  handle-failure:
    needs: fetch-market-data
    if: failure()
    uses: ./.github/workflows/handle-workflow-failure.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read  # Required to read workflow run details and logs
    secrets:
      PR_WORKFLOW_TOKEN: ${{ secrets.PR_WORKFLOW_TOKEN }}
    with:
      workflow_name: "Market Data Fetch"
      failure_title: "❌ Market Data Fetch Failed"
      issue_labels: "workflow-failure,market-data,automated"
      workflow_file: "fetch-market-data.yml"
      run_id: ${{ github.run_id }}
      run_number: ${{ github.run_number }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      event_name: ${{ github.event_name }}
      branch: ${{ github.ref }}
      commit_sha: ${{ github.sha }}
      create_pr: true
