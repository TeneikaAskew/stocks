name: registry-check
# Plain pull_request, checked out at the PR HEAD: this job EXECUTES the PR's
# scripts/gate/export_model_registry.py, because a PR that changes the
# exporter and regenerates its JSON must be judged by the exporter it ships,
# and the PR's scripts/gate/spec_gate.py, to prove the gate a PR proposes
# still starts and reports before it becomes the gate that judges every
# later PR. That is why it runs apart from spec-gate.yml (pull_request_target,
# base checkout, nothing from the PR executed) and why it holds only the
# read-only token: never give this workflow secrets or write permissions.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Only where the exporter exists (stocks): a PR that edits the model registry
  # without regenerating its JSON fails here. --base keeps a registry edit that
  # reached main without its JSON from failing every later PR: only the PR that
  # touched the registry or the exporter, or made a fresh base stale, fails; the
  # rest pass with a notice naming main.
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # spec-gate.yml judges the PR with the BASE's gate, so a PR that breaks the
      # gate script (a syntax error, an import, a crash on startup) would merge
      # green and then fail every later PR. The head's gate must compile and,
      # run over this PR, reach a verdict: "spec gate ok" or "SPEC GATE FAILED".
      # The verdict itself is the base gate's business; only a gate that cannot
      # reach one fails here.
      - name: Proposed gate compiles and reaches a verdict
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          gate=scripts/gate/spec_gate.py
          for required in "$gate" .github/workflows/spec-gate.yml .github/workflows/registry-check.yml .githooks/pre-commit; do
            if ! git cat-file -e "$HEAD_SHA:$required" 2>/dev/null; then
              echo "::error::$required is missing from this PR's head; the gate and its workflows cannot be removed by a PR" >&2
              exit 1
            fi
          done
          # git runs a configured hook only when it is executable; a mode change to 100644
          # would silently switch the commit-time gate off.
          mode=$(git ls-tree "$HEAD_SHA" .githooks/pre-commit | cut -d' ' -f1)
          if [ "$mode" != "100755" ]; then
            echo "::error::.githooks/pre-commit has mode $mode at the head; the hook must stay executable (100755)" >&2
            exit 1
          fi
          python3 -m py_compile "$gate"
          set +e
          out=$(python3 "$gate" --pr "$BASE_SHA" "$HEAD_SHA" 2>&1); rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -gt 1 ] || ! printf '%s\n' "$out" | grep -qE '^(spec gate ok|SPEC GATE FAILED)'; then
            echo "::error::the proposed $gate exited $rc without a verdict; it would break the gate for every later PR" >&2
            exit 1
          fi
          echo "proposed gate reached a verdict (exit $rc); the base gate's verdict is the one that counts"

      # A verdict on this PR exercises one path through the gate. The gate's own suite
      # (hermetic: temporary repositories, no network) exercises the traced and
      # ready-for-review paths too, so a runtime error in check_close_out cannot
      # merge behind a chore PR that never reaches it.
      - name: Proposed gate passes its own suite
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          suite=tests/scripts/test_spec_gate.py
          if git cat-file -e "$BASE_SHA:$suite" 2>/dev/null && ! git cat-file -e "$HEAD_SHA:$suite" 2>/dev/null; then
            echo "::error::$suite exists on the base but this PR removes it; the proposed gate cannot be accepted untested" >&2
            exit 1
          fi
          if [ -f tests/scripts/test_spec_gate.py ]; then
            python3 -m pip install --quiet pytest pyyaml
            # --noconftest: the suite is hermetic; a repository conftest may import packages this job does not install
            python3 -m pytest tests/scripts/test_spec_gate.py -q -p no:cacheprovider --noconftest
          else
            echo "::notice::no tests/scripts/test_spec_gate.py in this repository; the verdict step above is the check"
          fi

      # Not `if: hashFiles(...)`: that reads the head checkout, so a PR that
      # deletes the exporter would skip its only check and pass. The exporter
      # is inapplicable only when neither side of the PR has it (solyra).
      - name: Model registry JSON matches its sources
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          exporter=scripts/gate/export_model_registry.py
          if git cat-file -e "$HEAD_SHA:$exporter" 2>/dev/null; then
            python3 scripts/gate/export_model_registry.py --check --rev "$HEAD_SHA" --base "$BASE_SHA"
          elif git cat-file -e "$BASE_SHA:$exporter" 2>/dev/null; then
            echo "::error::$exporter exists on the base but this PR removes it; the registry check cannot run" >&2
            exit 1
          else
            echo "::notice::no $exporter in this repository; nothing to check"
          fi
