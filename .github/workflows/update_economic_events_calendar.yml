name: Update Economic Events Calendar

on:
  schedule:
    # Run weekly on Sundays at 6 AM EST (11 AM UTC)
    - cron: '0 11 * * 0'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      fetch_historical:
        description: 'Fetch historical market data (daily OHLCV beyond 7-day window)'
        required: false
        default: false
        type: boolean
      target_date:
        description: 'Target date for analysis (YYYY-MM-DD format)'
        required: false
        default: ''
      date_range_start:
        description: 'Start date for date range analysis (YYYY-MM-DD)'
        required: false
        default: ''
      date_range_end:
        description: 'End date for date range analysis (YYYY-MM-DD)'
        required: false
        default: ''
      
permissions:
  contents: write  # Required for git push
  issues: write    # Required for creating issues on failure

jobs:
  update_market_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: true
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance requests beautifulsoup4 pyarrow
        pip install matplotlib seaborn plotly fredapi
        
    - name: Create data directory
      run: |
        mkdir -p data
        echo "Data directory ready"

    - name: Fetch historical market data
      if: ${{ github.event.inputs.fetch_historical == 'true' }}
      run: |
        echo "Fetching historical market data for all tickers..."

        # Determine date range for historical fetch
        if [ -n "${{ github.event.inputs.date_range_start }}" ] && [ -n "${{ github.event.inputs.date_range_end }}" ]; then
          START_DATE="${{ github.event.inputs.date_range_start }}"
          END_DATE="${{ github.event.inputs.date_range_end }}"
        else
          # Default: fetch last 365 days of historical data
          START_DATE=$(date -d '365 days ago' +'%Y-%m-%d')
          END_DATE=$(date +'%Y-%m-%d')
        fi

        echo "Fetching historical data from ${START_DATE} to ${END_DATE}"

        # Fetch historical data for each ticker
        for ticker in SPY QQQ IWM SPX; do
          echo "Fetching ${ticker}..."
          python scripts/fetch_market_data.py --tickers ${ticker} --historical --start-date ${START_DATE} --end-date ${END_DATE}
        done

        echo "Historical data fetch complete"
      continue-on-error: true

    - name: Set date environment variables
      run: |
        if [ -n "${{ github.event.inputs.target_date }}" ]; then
          echo "TARGET_DATE=${{ github.event.inputs.target_date }}" >> $GITHUB_ENV
        else
          echo "TARGET_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
        fi

        if [ -n "${{ github.event.inputs.date_range_start }}" ]; then
          echo "DATE_RANGE_START=${{ github.event.inputs.date_range_start }}" >> $GITHUB_ENV
        fi

        if [ -n "${{ github.event.inputs.date_range_end }}" ]; then
          echo "DATE_RANGE_END=${{ github.event.inputs.date_range_end }}" >> $GITHUB_ENV
        fi

        echo "Analysis date: ${TARGET_DATE}"

    - name: Update market events calendar
      run: |
        echo "Updating market events calendar for date: ${TARGET_DATE}"
        if [ -n "${DATE_RANGE_START}" ] && [ -n "${DATE_RANGE_END}" ]; then
          echo "Date range: ${DATE_RANGE_START} to ${DATE_RANGE_END}"
          python scripts/market_events_tracker.py --start-date "${DATE_RANGE_START}" --end-date "${DATE_RANGE_END}"
        elif [ -n "${TARGET_DATE}" ]; then
          python scripts/market_events_tracker.py --target-date "${TARGET_DATE}"
        else
          python scripts/market_events_tracker.py
        fi

        # Verify the JSON file was created
        if [ -f "data/market_events.json" ]; then
          echo "✓ market_events.json created successfully"
          echo "MARKET_EVENTS_EXISTS=true" >> $GITHUB_ENV
        else
          echo "✗ Warning: market_events.json was not created"
          echo "MARKET_EVENTS_EXISTS=false" >> $GITHUB_ENV
        fi
      env:
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      continue-on-error: true

    - name: Fetch earnings calendar
      run: |
        echo "Fetching upcoming earnings calendar..."
        if [ -n "${DATE_RANGE_START}" ] && [ -n "${DATE_RANGE_END}" ]; then
          echo "Date range: ${DATE_RANGE_START} to ${DATE_RANGE_END}"
          python scripts/fetch_earnings_calendar.py --start-date "${DATE_RANGE_START}" --end-date "${DATE_RANGE_END}"
        else
          # Default: fetch next 90 days of earnings
          python scripts/fetch_earnings_calendar.py --days 90
        fi

        # Verify the earnings file was created
        if [ -f "data/earnings/earnings_calendar.json" ]; then
          echo "✓ earnings_calendar.json created successfully"
          echo "EARNINGS_CALENDAR_EXISTS=true" >> $GITHUB_ENV
        else
          echo "✗ Warning: earnings_calendar.json was not created"
          echo "EARNINGS_CALENDAR_EXISTS=false" >> $GITHUB_ENV
        fi
      continue-on-error: true
    
    - name: Fetch economic calendar data
      env:
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      run: |
        echo "Fetching economic calendar data..."
        if [ -n "${DATE_RANGE_START}" ] && [ -n "${DATE_RANGE_END}" ]; then
          python scripts/fetch_economic_calendar.py --start-date "${DATE_RANGE_START}" --end-date "${DATE_RANGE_END}"
        elif [ -n "${TARGET_DATE}" ]; then
          python scripts/fetch_economic_calendar.py --target-date "${TARGET_DATE}"
        else
          python scripts/fetch_economic_calendar.py
        fi
      continue-on-error: true
    
    - name: Run enhanced market analysis
      run: |
        echo "Running enhanced market analysis..."
        if [ -n "${DATE_RANGE_START}" ] && [ -n "${DATE_RANGE_END}" ]; then
          python scripts/analyze_market_data_enhanced.py --ticker ALL --export --start-date "${DATE_RANGE_START}" --end-date "${DATE_RANGE_END}"
        elif [ -n "${TARGET_DATE}" ]; then
          python scripts/analyze_market_data_enhanced.py --ticker ALL --export --target-date "${TARGET_DATE}"
        else
          python scripts/analyze_market_data_enhanced.py --ticker ALL --export
        fi
      continue-on-error: true
    
    - name: Generate market report
      run: |
        python -c "
        import pandas as pd
        from datetime import datetime
        import json
        import os
        from pathlib import Path
        
        # Get target date from environment or use today
        target_date = os.environ.get('TARGET_DATE', datetime.now().strftime('%Y-%m-%d'))
        date_range_start = os.environ.get('DATE_RANGE_START', '')
        date_range_end = os.environ.get('DATE_RANGE_END', '')
        
        # Create daily market report
        report = {
            'generated_at': datetime.now().isoformat(),
            'date': target_date,
            'date_range_start': date_range_start,
            'date_range_end': date_range_end,
            'market_status': 'Updated',
            'events_processed': False,
            'analysis_complete': False
        }
        
        # Check if events were processed
        events_file = Path('data/market_events.csv')
        if events_file.exists():
            events_df = pd.read_csv(events_file)
            report['events_processed'] = True
            report['total_events'] = len(events_df)
        
        # Check if analysis was completed
        signals_dir = Path('data/signals')
        if signals_dir.exists():
            signal_files = list(signals_dir.glob('*.csv'))
            report['analysis_complete'] = len(signal_files) > 0
            report['signals_generated'] = len(signal_files)
        
        # Save report
        report_file = Path('data/daily_report.json')
        with open(report_file, 'w') as f:
            json.dump(report, f, indent=2)
        
        print(f'Report generated: {report}')
        "
    
    - name: Check for changes
      id: verify_changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        git diff --staged --quiet || echo "has_changes=true" >> $GITHUB_OUTPUT
    
    - name: Commit and push changes
      if: steps.verify_changes.outputs.has_changes == 'true'
      run: |
        git commit -m "Auto-update: Market data and events $(date +'%Y-%m-%d %H:%M:%S')"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
  # Handle workflow failures by creating/updating issues and PRs
  handle-failure:
    needs: update_market_data
    if: failure()
    uses: ./.github/workflows/handle-workflow-failure.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      workflow_name: "Economic Events Calendar Update"
      failure_title: "❌ Market Data Update Failed"
      issue_labels: "workflow-failure,economic-calendar,automated"
      workflow_file: "update_economic_events_calendar.yml"
      run_id: ${{ github.run_id }}
      run_number: ${{ github.run_number }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      event_name: ${{ github.event_name }}
      branch: ${{ github.ref }}
      commit_sha: ${{ github.sha }}
      create_pr: true

  notify_upcoming_events:
    runs-on: ubuntu-latest
    needs: update_market_data
    if: always()  # Run even if previous job has errors

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: main  # Ensure we get the latest from main branch

    - name: Pull latest changes
      run: |
        git pull origin main
        echo "Pulled latest changes from main"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas

    - name: Check for upcoming high-impact events
      run: |
        python -c "
        import pandas as pd
        from datetime import datetime, timedelta
        import os
        from pathlib import Path

        # Check if JSON file exists
        events_json = Path('data/market_events.json')

        if events_json.exists():
            events_df = pd.read_json('data/market_events.json', orient='records')
            events_df['date'] = pd.to_datetime(events_df['date'])
            print('✓ Loaded events from market_events.json')
        else:
            print('⚠️  Warning: market_events.json not found')
            print('The file may not have been created by the previous job.')
            print('This could indicate the market_events_tracker.py script failed.')
            exit(0)  # Exit gracefully without error

        # Check for events in next 3 days
        today = pd.Timestamp.now().normalize()
        future_date = today + timedelta(days=3)

        upcoming = events_df[
            (events_df['date'] >= today) &
            (events_df['date'] <= future_date) &
            (events_df['expected_impact'].isin(['High', 'Very High']))
        ]

        if not upcoming.empty:
            print('📅 UPCOMING HIGH IMPACT EVENTS:')
            for _, event in upcoming.iterrows():
                days_until = (event['date'] - today).days
                print(f'  {event[\"date\"].strftime(\"%Y-%m-%d\")} ({days_until} days): {event[\"event\"]} [{event[\"expected_impact\"]}]')
        else:
            print('✓ No high-impact events in the next 3 days')
        "
