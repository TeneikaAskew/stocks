name: Update Economic Events Calendar

on:
  schedule:
    # Run daily at 6 AM EST (11 AM UTC)
    - cron: '0 11 * * *'
    # Run at market close 4:30 PM EST (9:30 PM UTC) on weekdays
    - cron: '30 21 * * 1-5'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      fetch_historical:
        description: 'Fetch historical data'
        required: false
        default: 'false'
      target_date:
        description: 'Target date for analysis (YYYY-MM-DD format)'
        required: false
        default: ''
      date_range_start:
        description: 'Start date for date range analysis (YYYY-MM-DD)'
        required: false
        default: ''
      date_range_end:
        description: 'End date for date range analysis (YYYY-MM-DD)'
        required: false
        default: ''
      
jobs:
  update_market_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance requests beautifulsoup4 pyarrow
        pip install matplotlib seaborn plotly
        
    - name: Set date environment variables
      run: |
        if [ -n "${{ github.event.inputs.target_date }}" ]; then
          echo "TARGET_DATE=${{ github.event.inputs.target_date }}" >> $GITHUB_ENV
        else
          echo "TARGET_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
        fi
        
        if [ -n "${{ github.event.inputs.date_range_start }}" ]; then
          echo "DATE_RANGE_START=${{ github.event.inputs.date_range_start }}" >> $GITHUB_ENV
        fi
        
        if [ -n "${{ github.event.inputs.date_range_end }}" ]; then
          echo "DATE_RANGE_END=${{ github.event.inputs.date_range_end }}" >> $GITHUB_ENV
        fi
        
        echo "Analysis date: ${TARGET_DATE}"
    
    - name: Update market events calendar
      run: |
        echo "Updating market events calendar for date: ${TARGET_DATE}"
        if [ -n "${DATE_RANGE_START}" ] && [ -n "${DATE_RANGE_END}" ]; then
          echo "Date range: ${DATE_RANGE_START} to ${DATE_RANGE_END}"
          python scripts/market_events_tracker.py --start-date "${DATE_RANGE_START}" --end-date "${DATE_RANGE_END}"
        elif [ -n "${TARGET_DATE}" ]; then
          python scripts/market_events_tracker.py --target-date "${TARGET_DATE}"
        else
          python scripts/market_events_tracker.py
        fi
      continue-on-error: true
    
    - name: Fetch economic calendar data
      run: |
        echo "Fetching economic calendar data..."
        if [ -n "${DATE_RANGE_START}" ] && [ -n "${DATE_RANGE_END}" ]; then
          python scripts/fetch_economic_calendar.py --start-date "${DATE_RANGE_START}" --end-date "${DATE_RANGE_END}"
        elif [ -n "${TARGET_DATE}" ]; then
          python scripts/fetch_economic_calendar.py --target-date "${TARGET_DATE}"
        else
          python scripts/fetch_economic_calendar.py
        fi
      continue-on-error: true
    
    - name: Run enhanced market analysis
      run: |
        echo "Running enhanced market analysis..."
        if [ -n "${DATE_RANGE_START}" ] && [ -n "${DATE_RANGE_END}" ]; then
          python scripts/analyze_market_data_enhanced.py --ticker ALL --export --start-date "${DATE_RANGE_START}" --end-date "${DATE_RANGE_END}"
        elif [ -n "${TARGET_DATE}" ]; then
          python scripts/analyze_market_data_enhanced.py --ticker ALL --export --target-date "${TARGET_DATE}"
        else
          python scripts/analyze_market_data_enhanced.py --ticker ALL --export
        fi
      continue-on-error: true
    
    - name: Generate market report
      run: |
        python -c "
        import pandas as pd
        from datetime import datetime
        import json
        import os
        from pathlib import Path
        
        # Get target date from environment or use today
        target_date = os.environ.get('TARGET_DATE', datetime.now().strftime('%Y-%m-%d'))
        date_range_start = os.environ.get('DATE_RANGE_START', '')
        date_range_end = os.environ.get('DATE_RANGE_END', '')
        
        # Create daily market report
        report = {
            'generated_at': datetime.now().isoformat(),
            'date': target_date,
            'date_range_start': date_range_start,
            'date_range_end': date_range_end,
            'market_status': 'Updated',
            'events_processed': False,
            'analysis_complete': False
        }
        
        # Check if events were processed
        events_file = Path('data/market_events.csv')
        if events_file.exists():
            events_df = pd.read_csv(events_file)
            report['events_processed'] = True
            report['total_events'] = len(events_df)
        
        # Check if analysis was completed
        signals_dir = Path('data/signals')
        if signals_dir.exists():
            signal_files = list(signals_dir.glob('*.csv'))
            report['analysis_complete'] = len(signal_files) > 0
            report['signals_generated'] = len(signal_files)
        
        # Save report
        report_file = Path('data/daily_report.json')
        with open(report_file, 'w') as f:
            json.dump(report, f, indent=2)
        
        print(f'Report generated: {report}')
        "
    
    - name: Check for changes
      id: verify_changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        git diff --staged --quiet || echo "has_changes=true" >> $GITHUB_OUTPUT
    
    - name: Commit and push changes
      if: steps.verify_changes.outputs.has_changes == 'true'
      run: |
        git commit -m "Auto-update: Market data and events $(date +'%Y-%m-%d %H:%M:%S')"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Create issue on failure
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          const date = new Date().toISOString().split('T')[0];
          const issue = await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Market Data Update Failed - ${date}`,
            body: `The automated market data update failed on ${date}. Please check the workflow logs.`,
            labels: ['bug', 'automated']
          });
          console.log(`Created issue #${issue.data.number}`);

  notify_upcoming_events:
    runs-on: ubuntu-latest
    needs: update_market_data
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Check for upcoming high-impact events
      run: |
        python -c "
        import pandas as pd
        from datetime import datetime, timedelta
        
        # Load events
        events_df = pd.read_csv('data/market_events.csv')
        events_df['date'] = pd.to_datetime(events_df['date'])
        
        # Check for events in next 3 days
        today = pd.Timestamp.now().normalize()
        future_date = today + timedelta(days=3)
        
        upcoming = events_df[
            (events_df['date'] >= today) & 
            (events_df['date'] <= future_date) &
            (events_df['expected_impact'].isin(['High', 'Very High']))
        ]
        
        if not upcoming.empty:
            print('UPCOMING HIGH IMPACT EVENTS:')
            for _, event in upcoming.iterrows():
                days_until = (event['date'] - today).days
                print(f'  {event[\"date\"].strftime(\"%Y-%m-%d\")} ({days_until} days): {event[\"event\"]} [{event[\"expected_impact\"]}]')
        "