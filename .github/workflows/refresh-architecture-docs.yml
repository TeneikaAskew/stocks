name: Monthly architecture doc refresh

# Refreshes ARCHITECTURE.md, DATA_DEPENDENCIES.md, COST_ANALYSIS.md and
# README.md from live GCP state on the first day of every month.
#
# How it works (rebuilt 2026-09-07 after the 2026-09-02 run replaced a
# 394-line hand-maintained ARCHITECTURE.md with a 158-line regeneration that
# named 4 of 67 declared jobs — see docs/audits/ARCHITECTURE_DOCS_AUDIT_2026-09-07.md):
#   1. Authenticates to GCP via Workload Identity Federation.
#   2. Snapshots live state: asset inventory + IAM + 90-day billing rollup
#      (as before) PLUS run jobs/executions/services, schedulers, Cloud Build
#      triggers, domain mappings, Cloud SQL config/backups/dumps, secrets,
#      Pub/Sub, sinks, Cloud Tasks, service accounts, image tags and the
#      live table statistics, all through scripts/maintenance/doc_inventory.py.
#   3. Digests those snapshots into small per-resource files under
#      refresh-inputs/ (Gemini's read_file truncates large JSON; the 2026-09
#      run said so and still went green) and reconciles them with what
#      gcp/deploy.sh, gcp/schema.sql and platform/api declare.
#   4. Renders the <!-- inventory:*:start/end --> blocks in ARCHITECTURE.md
#      and DATA_DEPENDENCIES.md DETERMINISTICALLY from that data. Counting
#      is not a language-model task.
#   5. Invokes Gemini CLI (Vertex AI, WIF ADC — no GEMINI_API_KEY) with the
#      prompts under .github/prompts/ to UPDATE THE PROSE IN PLACE around the
#      blocks. The prompts forbid regenerating from scratch and forbid
#      touching marker blocks.
#   6. Gates the result: today's stamp, every declared and live job / table /
#      route / scheduler present, one §2 and §3 subsection per table, marker
#      blocks byte-identical to a fresh render, no heading lost since the
#      previous version (or listed under "Removed since last refresh"), size
#      floor, no stale strings, no dead links, docs-vs-live drift clean
#      (scripts/verify_docs_against_live.py), no "truncated" in the Gemini
#      transcripts.
#   7. Opens a PR titled "Monthly architecture doc refresh: YYYY-MM" if any
#      doc changed beyond its "Generated" line; exits clean otherwise.
#
# Required GitHub secrets (one-time setup, see SETUP.md):
#   - GCP_WIF_PROVIDER, GCP_WIF_SA_EMAIL      Workload Identity Federation
#   - CLOUD_SQL_CONNECTION_NAME, DB_USER, DB_PASS, DB_NAME   live table stats
#   - PR_WORKFLOW_TOKEN                        gh pr create
#
# Service account roles (see SETUP.md for grant commands):
#   - roles/cloudasset.viewer, roles/iam.securityReviewer          (as before)
#   - roles/bigquery.dataViewer + roles/bigquery.jobUser           (billing)
#   - roles/aiplatform.user                                        (Gemini)
#   - roles/run.viewer, roles/cloudscheduler.viewer, roles/cloudbuild.builds.viewer,
#     roles/cloudsql.viewer + roles/cloudsql.client, roles/secretmanager.viewer,
#     roles/pubsub.viewer, roles/logging.viewer, roles/cloudtasks.viewer,
#     roles/artifactregistry.reader, roles/storage.objectViewer     (live snapshot)

on:
  schedule:
    - cron: '0 6 1 * *'   # 06:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate docs but skip PR creation (for testing).'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write       # push the bot branch
  pull-requests: write  # open the PR
  id-token: write       # WIF token

env:
  GCP_PROJECT: adept-mountain-474619-d4
  GCP_LOCATION: us-east1
  REGION: us-east1
  PR_BRANCH_PREFIX: bot/arch-refresh
  GEMINI_MODEL: gemini-2.5-pro
  # Gemini CLI refuses to run in a directory that hasn't been trusted via
  # the interactive `gemini trust` command. CI has no interactive shell,
  # so the run dies at the first invocation with exit code 55:
  #   "Gemini CLI is not running in a trusted directory."
  # Setting this env var explicitly trusts the workspace for headless use.
  # Equivalent to passing --skip-trust on every gemini call, but one edit
  # instead of four.
  GEMINI_CLI_TRUST_WORKSPACE: 'true'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Tooling ───────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node (for Gemini CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps
        # bigquery for the billing rollup; sqlalchemy/pg8000/connector for the
        # live table statistics (same set the calibration step below needs).
        run: pip install --quiet google-cloud-bigquery sqlalchemy pg8000 pandas cloud-sql-python-connector

      - name: Install Gemini CLI
        # Pinned: --allowed-tools was deprecated and YOLO behaviour changed
        # between minor versions. Without a pin, a future minor bump can
        # silently change the security model under us.
        run: npm install -g @google/gemini-cli@^0.40

      # ── Gemini Policy Engine: default-deny + explicit allowlist ───────────
      # Rationale: --yolo + --allowed-tools (the previous design) does NOT
      # restrict the toolset. Per the policy-engine docs, YOLO mode injects
      # a high-priority built-in rule that allows ALL tools — including
      # run_shell_command, web_fetch, save_memory — defeating any
      # --allowed-tools intent. --allowed-tools is itself flagged
      # [DEPRECATED] in the current CLI's --help.
      #
      # The supported security model is the Policy Engine: a TOML file at
      # ~/.gemini/policies/*.toml that the CLI auto-loads. Default-deny
      # priority 1, then an explicit allow priority 100 for the seven
      # tools the doc-regen prompts genuinely need:
      #   read_file, write_file, replace, glob, grep_search,
      #   list_directory, read_many_files.
      # Notably absent: run_shell_command (no shell), web_fetch +
      # google_web_search (no network — workflow already gives the model
      # the gcp_*.json and billing_90d.json snapshots it needs), and
      # save_memory (no cross-run state).
      - name: Write Gemini policy (default-deny + allowlist)
        run: |
          mkdir -p "${HOME}/.gemini/policies"
          cat > "${HOME}/.gemini/policies/refresh-docs.toml" <<'TOML'
          # Default-deny everything
          [[rule]]
          toolName = "*"
          decision = "deny"
          priority = 1

          # Explicit allow for the doc-regen toolset
          [[rule]]
          toolName = ["read_file", "write_file", "replace", "glob", "grep_search", "list_directory", "read_many_files"]
          decision = "allow"
          priority = 100
          TOML
          echo "::notice::Wrote Gemini policy:"
          cat "${HOME}/.gemini/policies/refresh-docs.toml"

      # ── GCP auth via Workload Identity Federation ─────────────────────────
      # The same auth covers gcloud + BigQuery + Vertex AI — no separate
      # GEMINI_API_KEY secret needed. Vertex picks up ADC automatically
      # when GOOGLE_GENAI_USE_VERTEXAI=true.
      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      # ── Snapshot live GCP state ───────────────────────────────────────────
      # Snapshots land in refresh-inputs/, NOT at the repo root. The root
      # names (gcp_inventory.json etc.) are gitignored, and the Gemini CLI
      # respects .gitignore for EVERY file tool — the 2026-09-01 run (#953)
      # proved it: read_file returned "ignored by configured ignore patterns",
      # glob/list couldn't see the files at all, and each doc was generated
      # blind (ARCHITECTURE.md gave up, COST_ANALYSIS.md wrote a placeholder,
      # DATA_DEPENDENCIES.md was improvised from source grep alone).
      # The files are also RENAMED (inventory.json / iam.json / billing.json),
      # not just relocated: the root .gitignore entries are BASENAME patterns,
      # which match at any directory depth, so refresh-inputs/gcp_inventory.json
      # would still be ignored (caught by Codex on #961; verified with
      # `git check-ignore -v`). The guard below asserts none of the input
      # paths are ignored, so a future .gitignore edit that re-hides them
      # fails here with a precise message instead of resurfacing as
      # mysteriously blind docs.
      #
      # refresh-inputs/ is untracked-but-not-ignored: visible to the model,
      # never staged (the PR step adds only the named docs), and it only
      # ever exists on the runner.
      #
      # Every snapshot step fails loud on empty output (Rule 3.7): an empty
      # inventory/IAM/billing input means a broken dump, and generating docs
      # from it produces plausible-looking wrong content — worse than a red run.
      - name: Dump asset inventory
        run: |
          mkdir -p refresh-inputs
          for F in refresh-inputs/inventory.json refresh-inputs/iam.json refresh-inputs/billing.json; do
            if PATTERN=$(git check-ignore -v "$F"); then
              echo "::error::${F} is gitignored (${PATTERN}) — Gemini's file tools respect .gitignore, so the model would generate docs blind. Rename the file or fix .gitignore."
              exit 1
            fi
          done
          gcloud asset search-all-resources \
            --scope="projects/${GCP_PROJECT}" \
            --format=json > refresh-inputs/inventory.json
          ROWS=$(jq 'length' refresh-inputs/inventory.json)
          echo "Inventory rows: ${ROWS}"
          if [ "${ROWS}" -eq 0 ]; then
            echo "::error::asset inventory returned 0 resources — dump is broken, refusing to generate docs from it"
            exit 1
          fi

      - name: Dump IAM policy
        run: |
          gcloud projects get-iam-policy "${GCP_PROJECT}" --format=json > refresh-inputs/iam.json
          BINDINGS=$(jq '.bindings | length' refresh-inputs/iam.json)
          echo "IAM bindings: ${BINDINGS}"
          if [ "${BINDINGS}" -eq 0 ]; then
            echo "::error::IAM policy dump has 0 bindings — dump is broken, refusing to generate docs from it"
            exit 1
          fi

      - name: Dump 90-day billing rollup
        run: |
          python - <<'PY'
          import os, json, decimal, datetime
          from google.cloud import bigquery

          project = os.environ["GCP_PROJECT"]
          client = bigquery.Client(project=project)

          # Discover the billing-export table dynamically — its suffix
          # encodes the billing-account ID and isn't stable across projects.
          #
          # There can be MORE THAN ONE (a dead table from a previous billing
          # account survives the account switch, and it sorts first). The
          # 2026-09-01 run took standard[0], queried the dead table, and
          # shipped an EMPTY billing_90d.json without failing — so pick the
          # table whose data is freshest, print every candidate's window,
          # and fail loud when the best still has nothing in-window.
          tables = [t.table_id for t in client.list_tables(f"{project}.billing_export")]
          standard = [t for t in tables if t.startswith("gcp_billing_export_v1_")]
          if not standard:
              raise SystemExit(f"no gcp_billing_export_v1_* table in dataset; got {tables}")

          def freshness(table):
              q = f"SELECT MAX(usage_start_time) AS latest FROM `{project}.billing_export.{table}`"
              latest = list(client.query(q).result())[0]["latest"]
              print(f"candidate {table}: latest usage_start_time = {latest}")
              return latest or datetime.datetime.min.replace(tzinfo=datetime.timezone.utc)

          billing_table = max(standard, key=freshness)
          print(f"selected {billing_table}")

          sql = f"""
          SELECT service.description AS service,
                 sku.description     AS sku,
                 SUM(cost)            AS cost_usd,
                 DATE_TRUNC(DATE(usage_start_time), MONTH) AS month
          FROM `{project}.billing_export.{billing_table}`
          WHERE _PARTITIONTIME >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 90 DAY)
          GROUP BY service, sku, month
          ORDER BY month DESC, cost_usd DESC
          """
          rows = [dict(r) for r in client.query(sql).result()]
          if not rows:
              raise SystemExit(
                  f"billing rollup for {billing_table} returned 0 rows in the 90-day "
                  "window. Either the export is stalled (check Billing → Billing "
                  "export, see solyra issue #12) or the wrong table was selected. "
                  "Refusing to generate COST_ANALYSIS.md from an empty rollup."
              )

          def enc(o):
              if isinstance(o, decimal.Decimal): return float(o)
              if isinstance(o, (datetime.date, datetime.datetime)): return o.isoformat()
              raise TypeError(f"unhandled {type(o)}")

          with open("refresh-inputs/billing.json", "w") as f:
              json.dump(rows, f, default=enc)
          print(f"wrote refresh-inputs/billing.json with {len(rows)} rows")
          PY

      # ── Snapshot the live GCP state the docs describe ─────────────────────
      # Everything the inventory module reads is listed in ARCHITECTURE.md §1
      # and the SETUP.md role table. A failed read RAISES (Rule 3.7); there is
      # no cached fallback, because a doc "verified" against stale state is
      # worse than a red run.
      - name: Snapshot live Cloud Run / Scheduler / SQL / Build state
        env:
          CLOUD_SQL_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          python -m scripts.maintenance.doc_inventory --write-snapshot refresh-inputs/live.json --db-live
          python scripts/verify_docs_against_live.py --write-snapshot refresh-inputs/verify_live.json
          python - <<'PY'
          import json
          live = json.load(open("refresh-inputs/live.json"))
          for key in ("jobs", "services", "schedulers", "secrets", "db_tables"):
              if not live.get(key):
                  raise SystemExit(f"live snapshot has no {key} — refusing to generate docs from it")
          print("live:", live["counts"], "db_tables:", len(live["db_tables"]))
          PY

      # ── Digest the snapshots into files a language model can read whole ───
      # refresh-inputs/inventory.json runs to thousands of lines and Gemini's
      # read_file truncates it (the 2026-09-02 ARCHITECTURE.md said "the
      # inventory.json file was truncated" and the run went green). The
      # per-resource files below are each a few KB.
      - name: Digest inputs
        run: |
          set -e
          jq -r '.[] | select(.assetType=="run.googleapis.com/Job") | .name | split("/")[-1]' refresh-inputs/inventory.json | sort > refresh-inputs/jobs.txt
          jq -r '.[] | select(.assetType=="run.googleapis.com/Service") | .name | split("/")[-1]' refresh-inputs/inventory.json | sort > refresh-inputs/services.txt
          jq -r '.[] | select(.assetType=="secretmanager.googleapis.com/Secret") | .name | split("/")[-1]' refresh-inputs/inventory.json | sort > refresh-inputs/secrets.txt
          jq -r '.[] | select(.assetType=="iam.googleapis.com/ServiceAccount") | .name | split("/")[-1]' refresh-inputs/inventory.json | sort > refresh-inputs/service_accounts.txt
          jq -r '.[] | select(.assetType=="storage.googleapis.com/Bucket") | .name | split("/")[-1]' refresh-inputs/inventory.json | sort > refresh-inputs/buckets.txt
          for F in jobs services secrets service_accounts buckets; do
            N=$(wc -l < "refresh-inputs/${F}.txt"); echo "${F}: ${N}"
            if [ "${N}" -eq 0 ]; then echo "::error::refresh-inputs/${F}.txt is empty — the asset inventory is missing that asset type"; exit 1; fi
          done
          python - <<'PY'
          import csv, json, collections
          rows = json.load(open("refresh-inputs/billing.json"))
          by_sku = collections.defaultdict(float); by_month = collections.defaultdict(float)
          for r in rows:
              by_sku[(r["service"], r["sku"])] += float(r["cost_usd"]); by_month[r["month"][:7]] += float(r["cost_usd"])
          with open("refresh-inputs/billing_by_sku.csv", "w", newline="") as f:
              w = csv.writer(f); w.writerow(["service", "sku", "cost_usd_90d"])
              for (svc, sku), c in sorted(by_sku.items(), key=lambda x: -x[1]): w.writerow([svc, sku, round(c, 2)])
          with open("refresh-inputs/billing_by_month.csv", "w", newline="") as f:
              w = csv.writer(f); w.writerow(["month", "cost_usd"])
              for m, c in sorted(by_month.items()): w.writerow([m, round(c, 2)])
          if not by_sku:
              raise SystemExit("billing digest is empty")
          PY
          python -m scripts.maintenance.doc_inventory --snapshot refresh-inputs/live.json --json > refresh-inputs/repo_inventory.json
          python -m scripts.maintenance.doc_inventory --snapshot refresh-inputs/live.json --markdown reconcile > refresh-inputs/live_vs_repo.md
          python -m scripts.maintenance.doc_inventory --snapshot refresh-inputs/live.json --markdown services > refresh-inputs/services.md
          python -m scripts.maintenance.doc_inventory --snapshot refresh-inputs/live.json --markdown schedulers > refresh-inputs/schedulers.md
          python -m scripts.maintenance.doc_inventory --snapshot refresh-inputs/live.json --markdown jobs > refresh-inputs/jobs.md
          ls -la refresh-inputs/

      # ── Keep the previous versions for the loss gates ─────────────────────
      - name: Save previous doc versions
        run: |
          mkdir -p refresh-inputs/previous
          cp ARCHITECTURE.md DATA_DEPENDENCIES.md COST_ANALYSIS.md README.md refresh-inputs/previous/

      # ── Render the inventory blocks deterministically, BEFORE Gemini ──────
      # Jobs, schedulers, tables, routes, services, modules, write/read graph,
      # multi-writer, orphans, blast radius, live table stats and the
      # live-vs-repo reconciliation are rendered from the snapshot into the
      # <!-- inventory:*:start/end --> markers. The model updates the prose
      # around them and must not touch them (a gate below re-renders and
      # diffs).
      - name: Render inventory blocks
        run: |
          python -m scripts.maintenance.doc_inventory --snapshot refresh-inputs/live.json --insert ARCHITECTURE.md DATA_DEPENDENCIES.md docs/API.md
          git --no-pager diff --stat -- ARCHITECTURE.md DATA_DEPENDENCIES.md

      # ── Regenerate docs via Gemini CLI (non-interactive) ──────────────────
      # Tool restriction is enforced by the policy file written above
      # (~/.gemini/policies/refresh-docs.toml), NOT by --allowed-tools or
      # --yolo. We pass neither: --allowed-tools is deprecated and --yolo
      # would override the policy with an "allow all" built-in rule.
      #
      # GOOGLE_GENAI_USE_VERTEXAI tells the Gemini CLI to use Vertex AI as
      # its provider (instead of the public Generative Language API), which
      # means the WIF-derived ADC is sufficient — no GEMINI_API_KEY needed.
      - name: Regenerate ARCHITECTURE.md
        env:
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
          GOOGLE_CLOUD_PROJECT: ${{ env.GCP_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ env.GCP_LOCATION }}
        run: |
          mkdir -p refresh-inputs/transcripts
          gemini --model "${GEMINI_MODEL}" \
            --prompt "$(cat .github/prompts/architecture.md)" 2>&1 | tee "refresh-inputs/transcripts/architecture.log"

      - name: Regenerate DATA_DEPENDENCIES.md
        env:
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
          GOOGLE_CLOUD_PROJECT: ${{ env.GCP_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ env.GCP_LOCATION }}
        run: |
          mkdir -p refresh-inputs/transcripts
          gemini --model "${GEMINI_MODEL}" \
            --prompt "$(cat .github/prompts/data-dependencies.md)" 2>&1 | tee "refresh-inputs/transcripts/data-dependencies.log"

      - name: Regenerate COST_ANALYSIS.md
        env:
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
          GOOGLE_CLOUD_PROJECT: ${{ env.GCP_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ env.GCP_LOCATION }}
        run: |
          mkdir -p refresh-inputs/transcripts
          gemini --model "${GEMINI_MODEL}" \
            --prompt "$(cat .github/prompts/cost-analysis.md)" 2>&1 | tee "refresh-inputs/transcripts/cost-analysis.log"

      # README runs LAST so it can read the freshly-regenerated other docs
      # to populate the doc-map table + Mermaid embed + cost headlines.
      - name: Regenerate README.md
        env:
          GOOGLE_GENAI_USE_VERTEXAI: 'true'
          GOOGLE_CLOUD_PROJECT: ${{ env.GCP_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ env.GCP_LOCATION }}
        run: |
          mkdir -p refresh-inputs/transcripts
          gemini --model "${GEMINI_MODEL}" \
            --prompt "$(cat .github/prompts/readme.md)" 2>&1 | tee "refresh-inputs/transcripts/readme.log"

      # ── Verify the regenerations actually happened and are complete ──────
      # The 2026-09-01 run shipped a placeholder COST_ANALYSIS.md, a
      # 35-of-62-table DATA_DEPENDENCIES.md, and silently reverted an
      # ARCHITECTURE.md the model had refused to write — all with a green
      # run. These deterministic gates make each of those a red run instead.
      - name: Verify regenerated docs
        run: |
          set -e
          TODAY=$(date -u +%Y-%m-%d)
          FAIL=0

          # 1. Every doc must carry TODAY's Generated stamp. All four prompts
          #    require the stamp, so a stale one means the model never wrote
          #    the file this run.
          for FILE in ARCHITECTURE.md DATA_DEPENDENCIES.md COST_ANALYSIS.md README.md; do
            if ! grep -qE "Generated(\*\*)? ${TODAY}" "$FILE"; then
              echo "::error::${FILE} does not carry today's 'Generated ${TODAY}' stamp — the model did not complete an update of it. Its transcript is in the step above."
              FAIL=1
            fi
          done

          # 2. DATA_DEPENDENCIES.md must mention every table schema.sql creates.
          MISSING=""
          for TABLE in $(grep -oE '^CREATE TABLE( IF NOT EXISTS)? [a-zA-Z0-9_]+' gcp/schema.sql | awk '{print $NF}' | sort -u); do
            grep -q "$TABLE" DATA_DEPENDENCIES.md || MISSING="${MISSING} ${TABLE}"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::DATA_DEPENDENCIES.md is missing schema.sql tables:${MISSING}"
            FAIL=1
          fi

          # 3. COST_ANALYSIS.md must contain a dollar figure and no placeholder.
          if ! grep -qE '\$[0-9]' COST_ANALYSIS.md; then
            echo "::error::COST_ANALYSIS.md contains no dollar figure — it was not generated from billing data"
            FAIL=1
          fi
          if grep -qiE 'placeholder' COST_ANALYSIS.md; then
            echo "::error::COST_ANALYSIS.md describes itself as a placeholder"
            FAIL=1
          fi

          # 4..12: the structural gates live in one script so they can be run
          #    locally (`python scripts/maintenance/check_generated_docs.py`)
          #    and unit-tested.
          python scripts/maintenance/check_generated_docs.py \
            --snapshot refresh-inputs/live.json \
            --previous-dir refresh-inputs/previous \
            --transcripts-dir refresh-inputs/transcripts || FAIL=1

          # 13. Docs vs live drift (schedules, names, counts, retired services).
          #     The verifier scans ~40 operational docs; only the four this
          #     workflow regenerates can be fixed by re-running it, so drift
          #     there is a failure and drift anywhere else is a warning the
          #     PR body carries (a stale count in docs/product/ must not block
          #     the monthly refresh forever).
          python scripts/verify_docs_against_live.py --snapshot refresh-inputs/verify_live.json \
            > refresh-inputs/verify_findings.txt 2>&1 || true
          cat refresh-inputs/verify_findings.txt
          if grep -qE '^\[[a-z-]+\] (README|ARCHITECTURE|DATA_DEPENDENCIES|COST_ANALYSIS)\.md:' refresh-inputs/verify_findings.txt; then
            echo "::error::verify_docs_against_live.py found drift in a regenerated doc (see above)"
            FAIL=1
          fi
          grep -E '^\[[a-z-]+\] ' refresh-inputs/verify_findings.txt \
            | grep -vE '^\[[a-z-]+\] (README|ARCHITECTURE|DATA_DEPENDENCIES|COST_ANALYSIS)\.md:' \
            | sed 's/^/::warning::docs-vs-live drift outside the regenerated docs: /' || true

          exit $FAIL

      # ── Refresh INVESTMENT_MODELS_SUMMARY.md resolved-values table ────────
      # Closes the doc-drift loop for ticker_calibration (issue #251). This
      # is a deterministic SQL→markdown render — no LLM involved — so it
      # runs as a separate Python step. Reads ticker_calibration via the
      # standard gcp.database engine (Cloud SQL Connector + WIF auth from
      # the workflow-level google-github-actions/auth step above).
      - name: Refresh ticker_calibration resolved-values table
        env:
          CLOUD_SQL_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          # Best-effort: the resolved-values table is nice-to-have but
          # should not block ARCHITECTURE/COST/README refresh if the DB
          # is unreachable (e.g. transient Cloud SQL outage).
          pip install --quiet sqlalchemy pg8000 pandas cloud-sql-python-connector
          python -m scripts.refresh_calibration_table || \
            echo "::warning::refresh_calibration_table failed; continuing without ticker_calibration update"

      # ── Decide whether the changes are meaningful ─────────────────────────
      # Strip the "Generated YYYY-MM-DD" footer + row-count noise before
      # diffing. If only the date moved, skip the PR and revert the file.
      - name: Detect meaningful changes
        id: detect
        run: |
          set +e
          MEANINGFUL=0
          for FILE in ARCHITECTURE.md DATA_DEPENDENCIES.md COST_ANALYSIS.md README.md docs/API.md docs/INVESTMENT_MODELS_SUMMARY.md; do
            if [ ! -f "$FILE" ]; then continue; fi
            # Mangle slashes so files in subdirs (e.g. docs/X.md) don't
            # try to redirect into /tmp/docs/ which doesn't exist. Without
            # this, set +e silently swallows the redirect failure, the
            # diff file is absent, the -s check is false, and we revert
            # the file we just regenerated. (Caught by Codex on PR #254.)
            DIFF_NAME="${FILE//\//_}"
            git diff --no-color "$FILE" \
              | grep -vE '^[-+]Generated 20[0-9]{2}-[0-9]{2}-[0-9]{2}' \
              | grep -vE '^[-+]\*\*Generated\*\* 20[0-9]{2}' \
              | grep -E '^[-+][^-+]' \
              > "/tmp/${DIFF_NAME}.diff"
            if [ -s "/tmp/${DIFF_NAME}.diff" ]; then
              CHANGED_LINES=$(wc -l < "/tmp/${DIFF_NAME}.diff")
              echo "::notice::$FILE has meaningful changes ($CHANGED_LINES lines)"
              MEANINGFUL=1
            else
              echo "$FILE: no meaningful changes (timestamp-only) — reverting"
              git checkout -- "$FILE"
            fi
          done
          echo "meaningful=$MEANINGFUL" >> "$GITHUB_OUTPUT"

      # ── Open PR if meaningful ─────────────────────────────────────────────
      - name: Open refresh PR
        if: steps.detect.outputs.meaningful == '1' && inputs.dry_run != 'true'
        env:
          # The default GITHUB_TOKEN cannot create PRs when the repo/org
          # "Allow GitHub Actions to create and approve pull requests"
          # setting is disabled — `gh pr create` fails with "GitHub
          # Actions is not permitted to create or approve pull requests"
          # regardless of the `pull-requests: write` permission declared
          # above (that's a repo Settings toggle, not a workflow
          # permissions block). PR_WORKFLOW_TOKEN is the same PAT
          # handle-workflow-failure.yml already uses for this exact
          # reason — see docs/CLAUDE_CODE_ON_WEB.md "Secret naming for
          # blast-radius isolation".
          GH_TOKEN: ${{ secrets.PR_WORKFLOW_TOKEN }}
        run: |
          MONTH=$(date -u +%Y-%m)
          BRANCH="${PR_BRANCH_PREFIX}-${MONTH}"

          git config user.name  "arch-refresh-bot"
          git config user.email "noreply@github.com"
          git checkout -b "$BRANCH"

          # Stage only the regenerated docs. refresh-inputs/ is untracked and
          # never staged.
          git add ARCHITECTURE.md DATA_DEPENDENCIES.md COST_ANALYSIS.md README.md docs/API.md docs/INVESTMENT_MODELS_SUMMARY.md

          if git diff --cached --quiet; then
            echo "nothing staged — exit clean"
            exit 0
          fi

          git commit -m "docs: monthly architecture doc refresh ${MONTH}"

          # bot/arch-refresh-YYYY-MM is disposable and re-created fresh from
          # main every run. If an earlier run already pushed it this month
          # (the 1st-of-month schedule, followed by a manual workflow_dispatch
          # re-run — exactly what happened 2026-07-06, issue #688) this run's
          # branch shares no history with the remote one and a plain push is
          # rejected as non-fast-forward. Force-push is safe here: this branch
          # is never shared/collaborated on and is NOT `main` (CLAUDE.md's
          # force-push ban is scoped to main).
          git push --force -u origin "$BRANCH"

          STAT=$(git diff --stat HEAD~1 HEAD -- ARCHITECTURE.md DATA_DEPENDENCIES.md COST_ANALYSIS.md README.md docs/API.md docs/INVESTMENT_MODELS_SUMMARY.md)

          # A PR may already be open for this branch from an earlier run this
          # month. `gh pr create` errors loudly in that case even though the
          # force-push above already updated it with fresh content — that's
          # not a failure, just nothing further to do.
          EXISTING_PR=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "::notice::PR #$EXISTING_PR already open for $BRANCH — force-pushed fresh content, no new PR needed"
            exit 0
          fi

          gh pr create \
            --base main --head "$BRANCH" \
            --title "Monthly architecture doc refresh: ${MONTH}" \
            --body "## Summary

          Automated monthly refresh of architecture / cost / dependency docs from live GCP state.

          ## Files changed

          \`\`\`
          ${STAT}
          \`\`\`

          ## What ran

          1. \`gcloud asset search-all-resources\` + \`get-iam-policy\` + BigQuery billing rollup → \`refresh-inputs/\`
          2. \`scripts/maintenance/doc_inventory.py --write-snapshot --db-live\` → live jobs, executions, services, schedulers, Cloud Build triggers, domain mappings, Cloud SQL, secrets, Pub/Sub, sinks, Cloud Tasks, images, table stats
          3. Inventory blocks in \`ARCHITECTURE.md\` / \`DATA_DEPENDENCIES.md\` re-rendered deterministically
          4. Gemini ${GEMINI_MODEL} (Vertex AI) updated the prose in place using prompts in \`.github/prompts/\`
          5. Gates: stamp, table/job/route/scheduler coverage, marker integrity, no lost headings, size floor, stale strings, dead links, \`verify_docs_against_live.py\`

          ## Reviewer checklist

          - Read \`ARCHITECTURE.md\` §15 (live-vs-repo reconciliation) and §18 (removed since last refresh) — those are the deltas that need a human decision
          - Confirm \`COST_ANALYSIS.md\` headline numbers match Cloud Console → Billing → Reports
          - Verify any new orphan-table flag in \`DATA_DEPENDENCIES.md\` §5 is real before acting on it

          Generated by \`.github/workflows/refresh-architecture-docs.yml\`"

      - name: No-op summary
        if: steps.detect.outputs.meaningful != '1'
        run: |
          echo "::notice::No meaningful doc changes this run — exiting clean without opening a PR."

  # Standard failure handler (CLAUDE.md "Automated Workflow Failure
  # Handling") — was missing here, so the 2026-07-01 `gh pr create`
  # failure (PR-creation blocked, see the Open refresh PR step above)
  # recurred silently for two monthly runs with no issue/PR trail.
  handle-failure:
    needs: refresh
    if: failure()
    uses: ./.github/workflows/handle-workflow-failure.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    secrets:
      PR_WORKFLOW_TOKEN: ${{ secrets.PR_WORKFLOW_TOKEN }}
    with:
      workflow_name: "Monthly architecture doc refresh"
      failure_title: "❌ Monthly architecture doc refresh failed"
      issue_labels: "workflow-failure,architecture-docs,automated"
      workflow_file: "refresh-architecture-docs.yml"
      run_id: ${{ github.run_id }}
      run_number: ${{ github.run_number }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      event_name: ${{ github.event_name }}
      branch: ${{ github.ref }}
      commit_sha: ${{ github.sha }}
      create_pr: true
