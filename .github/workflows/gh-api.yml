name: GitHub REST bridge

# Why this exists
# ---------------
# Claude Code Remote / Cowork sessions cannot reach api.github.com directly.
# Repo-scoped paths are intercepted and answered with:
#   403 {"message": "GitHub access is not enabled for this session. An org
#        admin must connect the Claude GitHub App for this organization.",
#        "documentation_url": "https://docs.anthropic.com/..."}
#
# Measured 2026-08-29 — the interception is NOT GitHub and NOT the egress
# proxy (the proxy reports recentRelayFailures: [] and lists `gh` as a
# preconfigured CLI). Two properties pin it down:
#   * credential-independent — byte-identical 403 with no auth, with the gh
#     CLI's stored github_pat_*, and with gh-stocks-repo-pat from Secret
#     Manager. No token fixes it.
#   * path-based — /rate_limit and /user return 200 while /meta, /octocat
#     and /repos/* return 403.
# The message is also misleading: the Claude GitHub App IS connected, which
# is how the mcp__github__* tools work. The raw REST path is fenced off by
# design so access flows through the App-scoped MCP surface instead.
#
# The mcp__github__* tools already cover issues, PRs, reviews, merges, files
# and branches. This bridge exists for the surfaces they do NOT expose —
# branch protection and rulesets being the ones that actually blocked work
# (a session could not verify the `main` protection rule it had just asked
# the owner to create).
#
# A GitHub Actions runner has unrestricted egress and a real token, so the
# call runs here and the response is handed back via the job summary and an
# artifact. Same shape as scripts/db_query_cr.sh: the sandbox dispatches over
# 443 and reads results back, while the privileged work happens elsewhere.
#
# Dispatch from a Claude session:  mcp__github__actions_run_trigger
# Dispatch from a desktop:
#   gh workflow run gh-api.yml -f endpoint='repos/{owner}/{repo}/branches/main/protection'
#
# Safety: mirrors db_query_cr.sh's --commit. GET is the default and needs no
# opt-in; any mutating method is refused unless confirm_write=true. The
# PR_WORKFLOW_TOKEN fallback is additionally restricted to GET requests
# on endpoints under repos/<this repo>/ (see the in-script comment): the
# bridge cannot read other repositories the PAT reaches, and never uses
# the PAT to mutate anything — mutations only run with the built-in
# token's explicitly granted permissions (the `permissions:` block
# below), so enabling a write surface takes a reviewed PR, not a
# dispatch flag.

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: 'API path, e.g. repos/{owner}/{repo}/branches/main/protection'
        required: true
        type: string
      method:
        description: 'HTTP method. Anything but GET needs confirm_write=true.'
        required: false
        default: 'GET'
        type: choice
        options: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE']
      body:
        description: 'JSON request body for POST/PUT/PATCH. Ignored for GET.'
        required: false
        default: ''
        type: string
      confirm_write:
        description: 'Required for any non-GET method. Mirrors db_query_cr.sh --commit.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

jobs:
  call:
    name: Call GitHub API
    runs-on: ubuntu-latest
    # One API round-trip; if it hasn't answered in 5 minutes it never will.
    # Without this a stalled connection occupies the runner until the
    # platform's 6-hour kill.
    timeout-minutes: 5
    steps:
      # db_query_cr.sh refuses to persist a write without --commit. Same
      # guarantee here: a typo'd DELETE cannot fire on the default path.
      - name: Refuse an unconfirmed write
        if: inputs.method != 'GET' && inputs.confirm_write != 'true'
        run: |
          echo "::error::method=${{ inputs.method }} requires confirm_write=true"
          exit 1

      # Inputs are passed through `env:` rather than interpolated into the
      # script body. A ${{ inputs.endpoint }} spliced into `run:` is a shell
      # injection vector — the dispatcher controls that string.
      - name: Call the API
        id: call
        env:
          ENDPOINT: ${{ inputs.endpoint }}
          METHOD: ${{ inputs.method }}
          BODY: ${{ inputs.body }}
          TOKEN_DEFAULT: ${{ secrets.GITHUB_TOKEN }}
          TOKEN_PAT: ${{ secrets.PR_WORKFLOW_TOKEN }}
        run: |
          set -uo pipefail

          # gh-style {owner}/{repo} placeholders, resolved against this repo.
          EP="${ENDPOINT#/}"
          EP="${EP//\{owner\}/${GITHUB_REPOSITORY%%/*}}"
          EP="${EP//\{repo\}/${GITHUB_REPOSITORY##*/}}"

          # Reject dot segments (literal or percent-encoded) anywhere in the
          # path. curl normalizes /../ before sending, so an endpoint like
          # repos/<this repo>/../../other/private passes a raw prefix check
          # yet reaches another repository — the PAT scope gate below is only
          # sound on a canonical path. No GitHub API path legitimately
          # contains . or .. segments, so refuse the whole run. curl is also
          # invoked with --path-as-is below, so nothing is normalized even
          # if a variant slips past this check.
          EP_PATH="${EP%%\?*}"
          if printf '%s' "$EP_PATH" | grep -qiE '(^|/)(\.|%2e){1,2}(/|$)'; then
            echo "::error::endpoint path contains dot segments — refusing"
            exit 1
          fi

          URL="https://api.github.com/${EP}"
          echo "Request: ${METHOD} ${URL}"
          echo

          STATUS=""
          # Tokens go in a curl config file, never in argv — argv is readable
          # from /proc/<pid>/cmdline by any other process on the runner.
          attempt() {
            local label="$1" tok="$2" cfg code rc
            if [ -z "$tok" ]; then
              printf '  %-18s SKIP (secret not configured)\n' "$label"
              return 2
            fi
            cfg="$(mktemp)"
            {
              printf 'header = "Authorization: Bearer %s"\n' "$tok"
              printf 'header = "Accept: application/vnd.github+json"\n'
              printf 'header = "X-GitHub-Api-Version: 2022-11-28"\n'
            } > "$cfg"
            # A transfer failure on THIS attempt must not publish the
            # previous attempt's body as if it were this attempt's answer.
            rm -f response.json
            # Bounded so a stalled response surfaces as TRANSFER FAILED in
            # seconds instead of hanging the step until timeout-minutes.
            # --path-as-is: never let curl canonicalize dot segments — the
            # scope gate validated the path as written.
            if [ "$METHOD" = "GET" ]; then
              code=$(curl -sS -K "$cfg" -X GET --path-as-is \
                       --connect-timeout 10 --max-time 60 \
                       -o response.json -w '%{http_code}' "$URL"); rc=$?
            else
              printf '%s' "$BODY" > body.json
              code=$(curl -sS -K "$cfg" -X "$METHOD" --path-as-is \
                       --data-binary @body.json \
                       --connect-timeout 10 --max-time 60 \
                       -o response.json -w '%{http_code}' "$URL"); rc=$?
            fi
            rm -f "$cfg"
            code="${code:-000}"
            # A transfer that never completed (DNS, TLS, connection refused)
            # exits nonzero and reports http_code 000 — and `[ 000 -lt 400 ]`
            # is TRUE, so without this the attempt scores as a SUCCESS: the
            # PAT fallback is skipped and an empty body is published as if it
            # were the answer. Reproduced against a refused port: curl exit 7,
            # http_code 000, response.json never created. Check rc FIRST.
            if [ "$rc" -ne 0 ]; then
              printf '  %-18s TRANSFER FAILED (curl exit %s, http_code %s)\n' \
                "$label" "$rc" "$code"
              STATUS="000"
              return 1
            fi
            printf '  %-18s HTTP %s\n' "$label" "$code"
            STATUS="$code"
            [ "$code" -lt 400 ]
          }

          # Least-privilege first. The built-in GITHUB_TOKEN has no
          # `administration` permission scope, so repo-settings endpoints are
          # expected to need the PAT — but let the run prove it rather than
          # assume, and report which one actually worked.
          #
          # The PAT fallback fires only for GET, and only against this
          # repository's own API surface:
          #
          # * GET-only: anyone with write access can dispatch this
          #   workflow, and confirm_write comes from that same caller, so
          #   it is a typo guard, not authorization. A PAT-backed mutation
          #   would let a non-admin collaborator administer the repo
          #   (weaken branch protection, edit rulesets). Mutations
          #   therefore only ever use the built-in GITHUB_TOKEN, whose
          #   capabilities are pinned by this workflow's `permissions:`
          #   block — enable a specific write surface by granting that one
          #   permission there via a reviewed PR, never by widening the
          #   PAT's role here.
          #
          # * Repo-scoped: GITHUB_TOKEN is repo-scoped by GitHub itself,
          #   but the PAT may reach other repositories — and this workflow
          #   prints the response into this repo's logs and artifact, so an
          #   arbitrary endpoint would let any dispatcher read anything the
          #   PAT can touch. Refusing keeps the bridge a window onto THIS
          #   repo.
          if [ "$EP" = "repos/${GITHUB_REPOSITORY}" ] \
             || [[ "$EP" == "repos/${GITHUB_REPOSITORY}/"* ]]; then
            PAT_IN_SCOPE=1
          else
            PAT_IN_SCOPE=0
          fi

          AUTH="none succeeded"
          if attempt "GITHUB_TOKEN" "$TOKEN_DEFAULT"; then
            AUTH="GITHUB_TOKEN"
          elif [ "$METHOD" != "GET" ]; then
            printf '  %-18s REFUSED (the PAT never authorizes a mutation — grant the built-in token the specific permission in this workflow instead)\n' \
              "PR_WORKFLOW_TOKEN"
          elif [ "$PAT_IN_SCOPE" = "1" ]; then
            if attempt "PR_WORKFLOW_TOKEN" "$TOKEN_PAT"; then
              AUTH="PR_WORKFLOW_TOKEN"
            fi
          else
            printf '  %-18s REFUSED (endpoint not under repos/%s — PAT fallback is repo-scoped)\n' \
              "PR_WORKFLOW_TOKEN" "$GITHUB_REPOSITORY"
          fi

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "auth=$AUTH"     >> "$GITHUB_OUTPUT"

          {
            echo "## \`${METHOD} /${EP}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Status | \`HTTP ${STATUS}\` |"
            echo "| Auth used | \`${AUTH}\` |"
            echo
            echo '```json'
            head -c 60000 response.json 2>/dev/null || echo '(no response body)'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # A 4xx from GitHub is a RESULT, not a workflow failure — a 404 on a
          # lookup is a legitimate answer. Failing here would fire
          # handle-failure and open a junk issue for every miss.
          echo
          echo "Result: HTTP ${STATUS} via ${AUTH}"

          # The body MUST go to stdout, and it is printed LAST so a tailed log
          # still contains it. $GITHUB_STEP_SUMMARY and the artifact are both
          # unreachable from the sessions this bridge serves: get_job_logs
          # returns the runner's stdout/stderr and carries neither, while
          # downloading an artifact needs /repos/*/actions/artifacts/*, which
          # is precisely the REST path being worked around. Printing here is
          # what makes the response readable at all; the summary and artifact
          # are secondary copies for a human on the run page.
          echo
          echo "----- BEGIN RESPONSE BODY (first 30000 bytes) -----"
          head -c 30000 response.json 2>/dev/null || echo '(no response body)'
          echo
          echo "----- END RESPONSE BODY -----"

      # v4 targets Node 20, which the runner now force-migrates to Node 24 with
      # a deprecation warning on every run. v5 still defaults to Node 20; v6 is
      # the first release that actually switches (runs.using: node24). Pinned to
      # v7 (current) — name/path/if-no-files-found/retention-days are unchanged
      # from v4, and this is the repo's only use of the action.
      - name: Upload response
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gh-api-response
          path: response.json
          if-no-files-found: warn
          retention-days: 7

  handle-failure:
    needs: call
    if: failure()
    uses: ./.github/workflows/handle-workflow-failure.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    secrets:
      PR_WORKFLOW_TOKEN: ${{ secrets.PR_WORKFLOW_TOKEN }}
    with:
      workflow_name: "GitHub REST bridge"
      failure_title: "❌ GitHub REST bridge failed"
      issue_labels: "workflow-failure,gh-api-bridge,automated"
      workflow_file: "gh-api.yml"
      run_id: ${{ github.run_id }}
      run_number: ${{ github.run_number }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      event_name: ${{ github.event_name }}
      branch: ${{ github.ref }}
      commit_sha: ${{ github.sha }}
      create_pr: false
