name: Download Google Sheets Data

on:
  schedule:
    # Run daily at 8:30 AM EST (1:30 PM UTC) - After Google Sheets update
    - cron: '30 13 * * *'
  workflow_dispatch:  # Allow manual triggering
    inputs:
      sheets:
        description: 'Specific sheets to download (space-separated, leave empty for all)'
        required: false
        default: ''
        type: string
      force_download:
        description: 'Force re-download even if data exists'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      output_format:
        description: 'Output format for downloaded data'
        required: false
        default: 'csv'
        type: choice
        options:
          - 'csv'
          - 'json'
          - 'both'

permissions:
  contents: write  # Required for git push
  issues: write    # Required for creating issues on failure

jobs:
  download-sheets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-google-api-${{ hashFiles('requirements-google-api.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-google-api-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

    - name: Set up Google credentials
      run: |
        mkdir -p credentials
        echo '${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}' > credentials/google-sheets-credentials.json

    - name: Download Google Sheets
      run: |
        ARGS="--spreadsheet-id ${{ secrets.GOOGLE_SPREADSHEET_ID }} --credentials credentials/google-sheets-credentials.json"

        # Add specific sheets if provided
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.sheets }}" ]; then
          ARGS="$ARGS --sheets ${{ github.event.inputs.sheets }}"
        fi

        # Add force download flag if enabled
        if [ "${{ github.event.inputs.force_download }}" = "true" ]; then
          ARGS="$ARGS --force"
        fi

        # Add output format if specified
        if [ -n "${{ github.event.inputs.output_format }}" ]; then
          ARGS="$ARGS --format ${{ github.event.inputs.output_format }}"
        fi

        python scripts/download_google_sheets.py $ARGS

    - name: Clean up credentials
      if: always()
      run: |
        rm -f credentials/google-sheets-credentials.json

    - name: Commit and push data with retry
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Add CSV files in data directory (force add since .gitignore excludes *.csv)
        git add -f google-apps-script/data/*.csv 2>/dev/null || true

        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          # Get current date for commit message
          COMMIT_DATE=$(date +'%Y-%m-%d')

          # Create commit message
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.sheets }}" ]; then
            git commit -m "update: Google Sheets data - $COMMIT_DATE (${{ github.event.inputs.sheets }})"
          else
            git commit -m "update: Google Sheets data - $COMMIT_DATE"
          fi

          # Pull-rebase-push with retry logic to handle concurrent workflow pushes
          MAX_RETRIES=5
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Push attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."

            # Try to push
            if git push origin main; then
              echo "✓ Successfully pushed changes"
              exit 0
            fi

            # Push failed, pull with rebase and retry
            echo "Push failed, pulling latest changes with rebase..."
            git pull --rebase origin main

            # Check if rebase had conflicts
            if [ $? -ne 0 ]; then
              echo "⚠️ Rebase conflict detected, attempting to resolve..."
              # For data files, prefer our version (the newer data)
              git checkout --ours google-apps-script/data/
              git add google-apps-script/data/
              git rebase --continue
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))

            # Wait briefly before retry (exponential backoff)
            WAIT_TIME=$((RETRY_COUNT * 2))
            echo "Waiting ${WAIT_TIME}s before retry..."
            sleep $WAIT_TIME
          done

          echo "✗ Failed to push after $MAX_RETRIES attempts"
          exit 1
        fi

  # Handle workflow failures by creating/updating issues and PRs
  handle-failure:
    needs: download-sheets
    if: failure()
    uses: ./.github/workflows/handle-workflow-failure.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read  # Required to read workflow run details and logs
    with:
      workflow_name: "Google Sheets Download"
      failure_title: "❌ Google Sheets Download Failed"
      issue_labels: "workflow-failure,google-sheets,automated"
      workflow_file: "download-google-sheets.yml"
      run_id: ${{ github.run_id }}
      run_number: ${{ github.run_number }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      event_name: ${{ github.event_name }}
      branch: ${{ github.ref }}
      commit_sha: ${{ github.sha }}
      create_pr: true
