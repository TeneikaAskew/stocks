name: Test Failure Handler

on:
  workflow_dispatch:  # Manual trigger only

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  test-job:
    runs-on: ubuntu-latest
    outputs:
      has_failures: ${{ steps.check_failures.outputs.has_failures }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Successful step
      run: |
        echo "This step will succeed"
        echo "✓ Success!"

    - name: Intentional failure step
      id: failing_step
      run: |
        echo "This step will fail intentionally to test the failure handler"
        echo "Simulating an error condition..."
        exit 1
      continue-on-error: true

    - name: Check for failures
      id: check_failures
      if: always()
      run: |
        if [ "${{ steps.failing_step.conclusion }}" = "failure" ]; then
          echo "has_failures=true" >> $GITHUB_OUTPUT
          echo "⚠️ Detected failure in previous step"
        else
          echo "has_failures=false" >> $GITHUB_OUTPUT
        fi

  # This should trigger and create an issue + PR
  handle-failure:
    needs: test-job
    if: failure() || (success() && needs.test-job.outputs.has_failures == 'true')
    uses: ./.github/workflows/handle-workflow-failure.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    with:
      workflow_name: "Failure Handler Test"
      failure_title: "🧪 Test: Failure Handler Verification"
      issue_labels: "test,workflow-failure,automated"
      workflow_file: "test-failure-handler.yml"
      run_id: ${{ github.run_id }}
      run_number: ${{ github.run_number }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      event_name: ${{ github.event_name }}
      branch: ${{ github.ref }}
      commit_sha: ${{ github.sha }}
      create_pr: true
