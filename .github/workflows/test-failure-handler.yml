name: Test Failure Handler

on:
  workflow_dispatch:  # Manual trigger only

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  test-job:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Successful step
      run: |
        echo "This step will succeed"
        echo "✓ Success!"

    - name: Intentional failure step
      id: failing_step
      run: |
        echo "This step will fail intentionally to test the failure handler"
        echo "Simulating an error condition..."
        echo "ERROR: Test error message that should be extracted"
        echo "TRACEBACK: Fake stack trace for testing"
        exit 1

  # This should trigger and create an issue + PR
  handle-failure:
    needs: test-job
    if: failure()
    uses: ./.github/workflows/handle-workflow-failure.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    secrets:
      PR_WORKFLOW_TOKEN: ${{ secrets.PR_WORKFLOW_TOKEN }}
    with:
      workflow_name: "Failure Handler Test"
      failure_title: "🧪 Test: Failure Handler Verification"
      issue_labels: "test,workflow-failure,automated"
      workflow_file: "test-failure-handler.yml"
      run_id: ${{ github.run_id }}
      run_number: ${{ github.run_number }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      event_name: ${{ github.event_name }}
      branch: ${{ github.ref }}
      commit_sha: ${{ github.sha }}
      create_pr: true
