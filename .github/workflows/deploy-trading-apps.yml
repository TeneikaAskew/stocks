name: Deploy Trading Apps to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'chart-viewer/**'
      - 'options-heatseeker/**'
      - 'index.html'
      - '.github/workflows/deploy-trading-apps.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployment directory
        run: mkdir -p _site

      - name: Copy landing page
        run: |
          if [ -f index.html ]; then
            cp index.html _site/
            echo "✅ Landing page copied"
          else
            echo "⚠️ No landing page found, creating basic redirect"
            cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=./chart-viewer/">
            <title>Trading Apps</title>
          </head>
          <body>
            <p><a href="./chart-viewer/">Chart Viewer</a></p>
            <p><a href="./options-heatseeker/">Options Heatseeker</a></p>
          </body>
          </html>
          EOF
          fi

      - name: Prepare Chart Viewer
        run: |
          cp -r chart-viewer _site/
          cd _site/chart-viewer/src

          # Replace the empty GITHUB_TOKEN with the secret
          sed -i "s|GITHUB_TOKEN: ''|GITHUB_TOKEN: '${{ secrets.GH_TRADING_APP_KEY }}'|g" config.js

          echo "✅ Chart Viewer prepared with token injection"
        env:
          GH_TRADING_APP_KEY: ${{ secrets.GH_TRADING_APP_KEY }}

      - name: Prepare Options Heatseeker
        run: |
          cp -r options-heatseeker _site/
          echo "✅ Options Heatseeker prepared"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
