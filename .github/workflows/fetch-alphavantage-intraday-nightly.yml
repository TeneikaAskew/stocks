name: Fetch Nightly Alpha Vantage Intraday Data

# Writes AlphaVantage 1-min intraday bars to Cloud SQL (market_data_intraday
# table, data_source='alphavantage') and to GCS (raw parquet copies).
#
# Complements the monthly fetcher (fetch-alphavantage-intraday-monthly.yml)
# by ingesting the previous trading day's bars overnight so the table stays
# fresh for next-day signal-quality analysis instead of waiting until the
# 1st of the following month.
#
# Required repository secrets:
#   ALPHA_VANTAGE_API_KEY        AlphaVantage API key (premium plan, 150 RPM)
#   GCP_SA_KEY                   JSON of a service account with roles:
#                                 - Cloud SQL Client
#                                 - Storage Object Admin (GCS bucket)
#   CLOUD_SQL_CONNECTION_NAME    e.g. project:region:instance
#   DB_USER                      PostgreSQL user
#   DB_PASS                      PostgreSQL password
#   DB_NAME                      PostgreSQL database name
#   GCS_BUCKET                   GCS bucket name (no gs:// prefix)
#
# Default range is yesterday-only. Schedule runs Tue–Sat 02:00 UTC so that
# Monday's bars are picked up by the Tuesday-night run, Friday's bars are
# picked up by the Saturday-night run. workflow_dispatch lets you backfill
# arbitrary date ranges manually.

on:
  schedule:
    # 02:00 UTC Tue–Sat (≈ 22:00 EDT / 21:00 EST the previous day).
    # Cron weekdays = the day the runner fires, so 2-6 = Tue..Sat.
    - cron: '0 2 * * 2-6'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Backfill start (YYYY-MM-DD). Empty = yesterday.'
        required: false
        default: ''
        type: string
      end_date:
        description: 'Backfill end (YYYY-MM-DD). Empty = yesterday.'
        required: false
        default: ''
        type: string
      symbol:
        description: 'Symbol or ALL'
        required: false
        default: 'ALL'
        type: string
      interval:
        description: 'Bar interval (1min, 5min, 15min, 30min, 60min)'
        required: false
        default: '1min'
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  fetch-intraday-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-av-intraday-nightly-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-av-intraday-nightly-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'cloud-sql-python-connector[pg8000]' google-cloud-storage

      - name: Write GCP service account key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::GCP_SA_KEY secret is not set. Configure it in repo settings."
            exit 1
          fi
          echo "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Resolve backfill date range
        id: dates
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            START="${{ github.event.inputs.start_date }}"
            END="${{ github.event.inputs.end_date }}"
            INTERVAL="${{ github.event.inputs.interval }}"
            SYMBOL="${{ github.event.inputs.symbol }}"
          fi
          START="${START:-$(date -u -d 'yesterday' +%Y-%m-%d)}"
          END="${END:-$(date -u -d 'yesterday' +%Y-%m-%d)}"
          INTERVAL="${INTERVAL:-1min}"
          SYMBOL="${SYMBOL:-ALL}"
          echo "START_DATE=$START" >> $GITHUB_OUTPUT
          echo "END_DATE=$END" >> $GITHUB_OUTPUT
          echo "INTERVAL=$INTERVAL" >> $GITHUB_OUTPUT
          echo "SYMBOL=$SYMBOL" >> $GITHUB_OUTPUT
          echo "Fetching AV intraday $SYMBOL @ $INTERVAL  $START → $END"

      - name: Fetch AlphaVantage intraday → Cloud SQL + GCS
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          CLOUD_SQL_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
        run: |
          for var in ALPHA_VANTAGE_API_KEY CLOUD_SQL_CONNECTION_NAME DB_USER DB_PASS DB_NAME GCS_BUCKET; do
            if [ -z "${!var}" ]; then
              echo "::error::$var secret is not set"
              exit 1
            fi
          done

          # --force re-fetches the current month every night so we don't
          # skip on the GCS parquet-exists cache. The DB upsert is idempotent
          # (conflict_cols=ticker,interval,ts) so re-fetching is safe.
          # Monthly fetcher (fetch-alphavantage-intraday-monthly.yml) stays
          # as the gap-filler backstop — it skips months already in GCS, so
          # after nightly populates each month's parquet, monthly only acts
          # on months where every nightly run failed.
          python -m gcp.fetchers.fetch_alphavantage_intraday \
            --symbol     "${{ steps.dates.outputs.SYMBOL }}" \
            --interval   "${{ steps.dates.outputs.INTERVAL }}" \
            --start-date "${{ steps.dates.outputs.START_DATE }}" \
            --end-date   "${{ steps.dates.outputs.END_DATE }}" \
            --force

  handle-failure:
    needs: fetch-intraday-data
    if: failure()
    uses: ./.github/workflows/handle-workflow-failure.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    secrets:
      PR_WORKFLOW_TOKEN: ${{ secrets.PR_WORKFLOW_TOKEN }}
    with:
      workflow_name: "Alpha Vantage Intraday Data (Nightly)"
      failure_title: "Alpha Vantage Nightly Intraday Data Fetch Failed"
      issue_labels: "workflow-failure,alpha-vantage,intraday-data,nightly,automated"
      workflow_file: "fetch-alphavantage-intraday-nightly.yml"
      run_id: ${{ github.run_id }}
      run_number: ${{ github.run_number }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      event_name: ${{ github.event_name }}
      branch: ${{ github.ref }}
      commit_sha: ${{ github.sha }}
      create_pr: true
