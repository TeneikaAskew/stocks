name: Backtest Pipeline

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "lib/**"
      - "scripts/**"
      - "tests/**"
      - "alert_config.json"
      - "requirements.txt"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tickers:
        description: "Space-separated tickers (default: IWM SPY QQQ)"
        required: false
        default: "IWM SPY QQQ"
      mode:
        description: "Pipeline mode"
        required: false
        default: "report-only"
        type: choice
        options:
          - report-only
          - full
          - full-no-sweep

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        # tests/test_e2e.py spins up Chromium via Playwright. The pip
        # `playwright` package only installs the Python bindings; the
        # browser binaries have to be downloaded separately.
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest tests/ -x -q

  report:
    name: Generate Report
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    env:
      # Cloud SQL credentials so lib/data_loader.py:DataLoader uses
      # market_data_daily / market_data_intraday (priority 0) instead
      # of falling through to local CSVs in data/{ticker}/ which
      # don't exist in a fresh CI runner.
      CLOUD_SQL_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_NAME: ${{ secrets.DB_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to GCP
        # Required for the Cloud SQL Python Connector — uses ADC.
        env:
          SA_KEY: ${{ secrets.CLAUDE_CODE_WEB_GCP_SA_KEY }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "::error::CLAUDE_CODE_WEB_GCP_SA_KEY secret is not set"
            exit 1
          fi
          echo "$SA_KEY" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Verify Cloud SQL config
        run: |
          for var in CLOUD_SQL_CONNECTION_NAME DB_USER DB_PASS DB_NAME; do
            if [ -z "${!var}" ]; then
              echo "::error::$var secret is not set"
              exit 1
            fi
          done

      - name: Determine tickers
        id: tickers
        run: echo "list=${{ github.event.inputs.tickers || 'IWM SPY QQQ' }}" >> "$GITHUB_OUTPUT"

      - name: Run pipeline
        run: |
          MODE="${{ github.event.inputs.mode || 'report-only' }}"
          TICKERS="${{ steps.tickers.outputs.list }}"

          if [ "$MODE" = "report-only" ]; then
            python scripts/run_pipeline.py --tickers $TICKERS --report-only
          elif [ "$MODE" = "full-no-sweep" ]; then
            python scripts/run_pipeline.py --tickers $TICKERS --skip-sweep
          else
            python scripts/run_pipeline.py --tickers $TICKERS
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: BACKTEST_RESULTS.md

      - name: Upload backtest CSVs
        uses: actions/upload-artifact@v4
        if: github.event.inputs.mode != 'report-only'
        with:
          name: backtest-results
          path: data/backtest_results/*.csv
