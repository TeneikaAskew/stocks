name: Calibrate Thresholds (manual / backfill)

# Manual entry-point for `scripts/calibrate_thresholds.py`. Two roles:
#
#   1. As-of backfill — populate `ticker_calibration` for past quarters
#      so the #250 drift guard has a 4-quarter rolling window without
#      waiting until 2027-01 for organic accumulation. Pass
#      `as_of=YYYY-MM-DD` to compute and write a calibration row stamped
#      with that date, using the lookback window ending on that date.
#
#   2. Same-day re-run — leave `as_of` empty for a `date.today()` run.
#      The quarterly Cloud Run Job already covers the live cadence; this
#      workflow exists for ad-hoc operator dispatches without rebuilding
#      the Cloud Run Job's baked-in image.
#
# This workflow runs the script on the GitHub Actions runner directly,
# bypassing the `calibrate-thresholds` Cloud Run Job's image-rebuild
# requirement (the same gap that #376b will close generally for
# schema migrations). The runner reads `gcp/database.py:get_engine()`
# the same way the live job does, so production DB writes are
# identical in shape.

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Calibration date in YYYY-MM-DD (e.g. 2025-10-01). Empty = today.'
        required: false
        default: ''
        type: string
      tickers:
        description: 'Comma-separated tickers (default: SPY,IWM,QQQ)'
        required: false
        default: 'SPY,IWM,QQQ'
        type: string
      lookback_days:
        description: 'Bar history window (default: 60)'
        required: false
        default: '60'
        type: string
      dry_run:
        description: 'Compute but do not write to Cloud SQL'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-calibrate-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-calibrate-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'cloud-sql-python-connector[pg8000]'

      - name: Write GCP service account key
        env:
          # 2026-05-10: consolidated on CLAUDE_CODE_WEB_GCP_SA_KEY.
          GCP_SA_KEY: ${{ secrets.CLAUDE_CODE_WEB_GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::CLAUDE_CODE_WEB_GCP_SA_KEY secret is not set"
            exit 1
          fi
          echo "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Run calibration
        env:
          CLOUD_SQL_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          AS_OF: ${{ github.event.inputs.as_of }}
          TICKERS: ${{ github.event.inputs.tickers }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          # `pipefail` is REQUIRED — without it, the pipe to `tee` below
          # masks any non-zero exit from the calibration script, leaving
          # the workflow green even when calibration fails (invalid
          # --as-of, missing data sys.exit(3), DB write error). Codex
          # caught this on PR #384's first commit; the test plan
          # requires handle-failure to fire on real failures.
          set -eo pipefail

          for var in CLOUD_SQL_CONNECTION_NAME DB_USER DB_PASS DB_NAME; do
            if [ -z "${!var}" ]; then
              echo "::error::$var secret is not set"
              exit 1
            fi
          done

          ARGS=(--tickers "$TICKERS" --lookback-days "$LOOKBACK_DAYS")
          if [ -n "$AS_OF" ]; then
            ARGS+=(--as-of "$AS_OF")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          echo "## Calibration run" >> $GITHUB_STEP_SUMMARY
          echo "- as-of: ${AS_OF:-today}" >> $GITHUB_STEP_SUMMARY
          echo "- tickers: $TICKERS" >> $GITHUB_STEP_SUMMARY
          echo "- lookback_days: $LOOKBACK_DAYS" >> $GITHUB_STEP_SUMMARY
          echo "- dry_run: $DRY_RUN" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -m scripts.calibrate_thresholds "${ARGS[@]}" \
            2>&1 | tee /tmp/calibrate-output.log
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload calibration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibrate-thresholds-${{ github.run_id }}
          path: /tmp/calibrate-output.log
          if-no-files-found: ignore

  handle-failure:
    needs: calibrate
    if: failure()
    uses: ./.github/workflows/handle-workflow-failure.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    secrets:
      PR_WORKFLOW_TOKEN: ${{ secrets.PR_WORKFLOW_TOKEN }}
    with:
      workflow_name: "Calibrate Thresholds (manual / backfill)"
      failure_title: "❌ calibrate-thresholds-backfill failed"
      issue_labels: "workflow-failure,calibration,automated"
      workflow_file: "calibrate-thresholds-backfill.yml"
      run_id: ${{ github.run_id }}
      run_number: ${{ github.run_number }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      event_name: ${{ github.event_name }}
      branch: ${{ github.ref }}
      commit_sha: ${{ github.sha }}
      create_pr: false
