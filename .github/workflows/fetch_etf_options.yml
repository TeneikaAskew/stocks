name: Fetch ETF Options Data

on:
  schedule:
    # Market open - 9:30 AM ET (13:30 UTC)
    - cron: '30 13 * * 1-5'
    # 5 mins after open - 9:35 AM ET (13:35 UTC)
    - cron: '35 13 * * 1-5'
    # 10 mins after open - 9:40 AM ET (13:40 UTC)
    - cron: '40 13 * * 1-5'
    # Volatility settling - 10:00 AM ET (14:00 UTC)
    - cron: '0 14 * * 1-5'
    # Mid-morning - 11:30 AM ET (15:30 UTC)
    - cron: '30 15 * * 1-5'
    # Post-lunch - 1:00 PM ET (17:00 UTC)
    - cron: '0 17 * * 1-5'
    # Afternoon session - 2:30 PM ET (18:30 UTC)
    - cron: '30 18 * * 1-5'
    # Power hour - 3:30 PM ET (19:30 UTC)
    - cron: '30 19 * * 1-5'
    # After close - 4:05 PM ET (20:05 UTC)
    - cron: '5 20 * * 1-5'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Required for git push
  issues: write    # Required for creating issues on failure

jobs:
  fetch-etf-options:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create data directories
        run: |
          mkdir -p data/options/etfs

      - name: Fetch ETF options data
        run: |
          python scripts/fetch_etf_options_intraday.py
        env:
          TZ: America/New_York

      - name: Commit and push data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/options/etfs/*.parquet

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update ETF options data - $(date +'%Y-%m-%d %H:%M:%S %Z')"

          # Retry push up to 3 times on failure
          MAX_RETRIES=3
          RETRY_COUNT=0
          PUSH_SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$PUSH_SUCCESS" = "false" ]; do
            if [ $RETRY_COUNT -gt 0 ]; then
              echo "Push failed, attempt $((RETRY_COUNT + 1))/$MAX_RETRIES"
              echo "Waiting 10-15 seconds before retry..."
              sleep $((10 + RANDOM % 6))  # Random sleep 10-15 seconds to stagger workflows
            fi

            if git push; then
              echo "Push successful!"
              PUSH_SUCCESS=true
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
            fi
          done

          if [ "$PUSH_SUCCESS" = "false" ]; then
            echo "Failed to push after $MAX_RETRIES attempts"
            exit 1
          fi
        env:
          TZ: America/New_York

  # Handle workflow failures by creating/updating issues and PRs
  handle-failure:
    needs: fetch-etf-options
    if: failure()
    uses: ./.github/workflows/handle-workflow-failure.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read  # Required to read workflow run details and logs
    with:
      workflow_name: "ETF Options Fetch"
      failure_title: "❌ ETF Options Fetch Failed"
      issue_labels: "workflow-failure,etf-options,automated"
      workflow_file: "fetch_etf_options.yml"
      run_id: ${{ github.run_id }}
      run_number: ${{ github.run_number }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      event_name: ${{ github.event_name }}
      branch: ${{ github.ref }}
      commit_sha: ${{ github.sha }}
      create_pr: true
