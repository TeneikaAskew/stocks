name: Dormant surface — retire or restore
description: A table, job, endpoint, or module that is unfed, unread, or unscheduled. Decide its fate on evidence.
title: "<surface>: <unfed | unread | unscheduled> — retire or restore?"
body:
  - type: markdown
    attributes:
      value: |
        For surfaces that are neither clearly alive nor clearly dead: a table
        nothing writes, a job nothing schedules, an endpoint nothing calls, a
        module whose consumers vanished in a rewrite.

        **"Nothing reads it" is a claim that has to be measured, in both repos.**
        The frontend lives in TeneikaAskew/solyra; a table with no Python
        consumer can still be rendered on a dashboard tile. `playbook_cards`
        looked dormant and was being served to the user as today's setups.

        **Distinguish "never scheduled" from "the writer failed".** They have
        different fixes and the failure history will not tell you which. The
        `phase6-playbook` job had six executions, all on one day in June, and no
        Cloud Scheduler entry at all. Reading the code would not have found
        that; `gcloud scheduler jobs list` did.

        **A code-only surface has no live state, and saying so is not a gap.**
        A module with no writer, no schedule and no execution history is filed
        with those fields marked n/a; the importer search is then the whole of
        the evidence. What is not acceptable is inventing a freshness number
        for a surface that has none.

        **The sample outputs in the placeholders are dated measurements, not
        current facts.** They show the shape of a conclusive answer. Re-run
        every one against the live system — the staleness figure in particular
        moves every day the writer stays broken.

  - type: input
    id: surface
    attributes:
      label: Surface
      description: The table, job, endpoint, or module, named exactly.
      placeholder: "playbook_cards (table) + phase6-playbook (Cloud Run Job)"
    validations:
      required: true

  - type: dropdown
    id: condition
    attributes:
      label: Condition
      options:
        - Unfed — consumers exist, writer stopped or never ran
        - Unread — writer runs on schedule, nothing consumes the output
        - Unscheduled — the job exists and is deployable but no scheduler fires it
        - Orphaned — neither written nor read
        - Never populated — created but has never held a row
    validations:
      required: true

  - type: textarea
    id: freshness-evidence
    attributes:
      label: Freshness and writer state, from the live system
      description: >-
        Query the data and read GCP. Not the docs: `docs/PIPELINE.md` was wrong
        about a schedule in two places. Paste command and output together.
      render: shell
      placeholder: |
        $ ./scripts/db_query_cr.sh -q "SELECT max(analysis_date), current_date - max(analysis_date), count(*) FROM playbook_cards"
        2026-06-13 | 85 | 36

        $ gcloud scheduler jobs list --location=us-east1 --filter="name~phase6"
        Listed 0 items.

        $ gcloud beta run jobs executions list --job=phase6-playbook --region=us-east1 --limit=10
        (six executions, all 2026-06-14)

        $ grep -n "phase6-playbook" gcp/deploy.sh
        (no _schedule entry; not in the all) target)
    validations:
      required: true

  - type: textarea
    id: consumers
    attributes:
      label: Consumers, measured in both repos
      description: >-
        Paste the searches. A surface is only dead when both sides come back
        empty. Say explicitly if you checked source only and not the deployed
        build.
      render: shell
      placeholder: |
        # Repo-wide over TRACKED files, not the five source directories — a job's
        # only caller is often a workflow. Measured:
        # .github/workflows/deploy-staging.yml:299 dispatches
        # refresh-earnings-views and the five-dir search misses it entirely.
        # ':!archive/' as well: archive/README.md says "Retired code ... Nothing
        # here runs in production", so a hit there is not a consumer. Measured —
        # TradingAlertSystem matches archive/standalone-scripts/trading_alerts.py
        # and nothing live, which would block a correct retirement.
        # ':!.github/ISSUE_TEMPLATE/' and ':!.claude/commands/' exclude the files
        # that cite example symbols in their own prose, THIS ONE INCLUDED. The
        # line above names TradingAlertSystem, so without them the search for it
        # matches this comment and .claude/commands/resolve-issue.md and returns
        # rc=0 forever — measured, exactly those two hits and nothing else. A
        # retirement check whose passing state is unreachable is not a check.
        # NOT by directory and NOT by extension: .claude/settings.json is an
        # executable hook and .claude/agents/*.md are executable too — measured,
        # gcp-config-reviewer read as dead under ':!*.md' while
        # .claude/agents/pre-deploy-check.md:75 delegates to it.
        # ':!*.drawio' and the live_gcp_snapshot fixture likewise: measured, the
        # three root .drawio diagrams and the GCP state capture they are drawn
        # from match six of seven probe surfaces and invoke none of them. Derive
        # this list, do not extend it per report — recipe in the resolver's
        # Phase 2. platform/api/openapi.json deliberately stays IN: it is
        # generated, so a retired route still named there means the snapshot was
        # not regenerated, which the check SHOULD catch.
        # ANCHOR AT THE REPO ROOT. `.` and the four Claude scopes are relative
        # to your CWD, and a pathspec that does not exist there is a CLEAN MISS
        # rather than an error. Measured from gcp/: all five searches below
        # return rc=1 for debug-workflow — "no consumers, dormant" — while the
        # root .claude/commands/ really does route to it.
        $ root=$(git rev-parse --show-toplevel)
        $ git -C "$root" grep -En "playbook_cards|/api/playbook" -- . ':!docs/' ':!archive/' ':!gcp/research/_archive/' ':!*.disabled' ':!.github/ISSUE_TEMPLATE/' ':!.claude/commands/' ':!*.md' ':!*.drawio' ':!tests/fixtures/live_gcp_snapshot_*.json' ':!.github/workflows/logs.txt'
        (142 matching LINES across 13 files: router, writer, tests. Lines, not
        occurrences — `git grep -c`/`wc -l` count lines, and 7 of these carry
        both alternatives, so the pattern occurs 149 times. Use `git grep -Eo`
        if you mean occurrences; say which one your number is.)

        # THE SEARCH ABOVE IS NOT THE WHOLE ANSWER. It excludes *.md and
        # .claude/commands/ because those cite example symbols in their own
        # prose — but .claude/agents/*.md and .claude/commands/*.md are also
        # EXECUTABLE, and a Claude agent or slash command is a surface you can
        # be retiring. Measured: gcp-config-reviewer returns NO MATCHES above
        # while .claude/agents/pre-deploy-check.md:75 delegates to it on every
        # deploy. So run these two as well, and exclude the surface's OWN
        # definition file — an agent always matches itself, which would make
        # every agent look consumed:
        $ git -C "$root" grep -nE "<surface>" -- .claude/agents ':!.claude/agents/<surface>.md'
        $ git -C "$root" grep -nE "<surface>" -- .claude/commands ':!.claude/commands/<surface>.md'
        $ git -C "$root" grep -nE "<surface>" -- .github/prompts ':!.github/prompts/<surface>.md'
        $ git -C "$root" grep -nE "<surface>" -- CLAUDE.md
        CLAUDE.md is the SIXTH executable-markdown scope and the easiest to
        mistake for prose: Claude Code loads it automatically and it routes by
        name — `CLAUDE.md:502` and `:507` send sessions to fallback-guard and
        pre-deploy-check. Measured on fallback-guard with its code and agent
        callers simulated away: every other scope returns no matches while
        CLAUDE.md still routes to it. Root file only; docs/*.md stay prose.
        That third one is the fourth executable-markdown scope found so far:
        scripts/maintenance/render_doc_prompts.py renders .github/prompts/*.md
        and refresh-architecture-docs.yml:537 cats the result into Gemini, so a
        symbol named only in a source template is a live input to a scheduled
        job that ':!*.md' hides. Measured on verify_docs_against_live
        with its real consumers simulated away — code, agents and commands all
        return "no matches" while .github/prompts/architecture.md:80 names
        scripts/verify_docs_against_live.py as the gate the refresh must pass.
        A hit in .claude/commands/ is AMBIGUOUS, not proof: it may be a real
        route (`/debug-workflow`) or one of these forms quoting an example.
        Read the two or three lines and say which. The resolver's Phase 4
        helper returns a distinct exit code for exactly this case.

        solyra: DashboardPage top setup tile (incl. review mode ?date=), PlaybookPage.
        Both live. So this is Tier 1: stale rows rendered as today's setups.
    validations:
      required: true

  - type: textarea
    id: forensics
    attributes:
      label: How it got here
      description: "Git forensics with dates and commits, via -G --no-renames (not -S). A surface dropped by an unrelated rewrite reads differently from one retired on purpose."
      render: shell
      placeholder: |
        # FIRST: is this clone shallow? If so every answer below is truncated at the
        # graft and there is NO warning — an empty result means "not in the window",
        # which is indistinguishable from "never had a consumer", the exact conclusion
        # this field exists to support. Measured: an unknown symbol returns empty with
        # rc=0, and the walk simply stops at the graft commit.
        $ git rev-parse --is-shallow-repository     # must print false
        $ git fetch --unshallow                     # if it printed true
        #
        # -G --no-renames --full-history, NOT -S. Measured: -S counts per blob, so a
        # rewritten import line inside ONE file leaves the count equal and -S skips
        # that commit; a pure rename is invisible to BOTH until --no-renames; and
        # default history simplification prunes side branches, so an importer that
        # lived only on a merged-and-deleted branch returns NOTHING until
        # --full-history (reproduced on git 2.43).
        #
        # The pathspec is THIS repo's source, and `--all` is not optional. `-- src
        # platform/src` is what this example was written against before the split and
        # it now covers nothing here: there is no src/, and platform/src left at #957.
        # Measured — under that pathspec `refresh-earnings-views`, `replay_signal_monitor`,
        # `_emergency_ceiling_block` and `db_query_cr` ALL return 0 commits, so the search
        # answers "never had a consumer" for every surface in the repo.
        # --diff-merges=separate as well: --full-history controls TRAVERSAL, not
        # whether merge diffs are SEARCHED. An importer introduced only by a manual
        # conflict resolution in a merge commit is invisible without it. Reproduced
        # on git 2.43.0 (solyra#63): without it the search returned only the commit
        # that REMOVED the importer; with it, the merge that added it appears too.
        # "Added by nobody, removed by someone" is the tell.
        # --no-patch as well, or this dumps a full diff against every merge
        # parent: measured on this repo, 12,981 lines for one symbol versus 9
        # with it. -G selection and the parent-qualified summaries are kept.
        # .claude/ is IN and .github/ISSUE_TEMPLATE/ is OUT, for the same reasons
        # the consumer field above gives. A Claude agent or command is a surface
        # you can be retiring, and its whole history lives under .claude/ —
        # measured, `code-reviewer` returns 0 commits without it and 2 with it.
        # Meanwhile these forms name example symbols, so leaving ISSUE_TEMPLATE
        # in returns commits that touched only this prose and none of the code.
        # .claude/agents IS implementation history; .claude/commands is BOTH,
        # and mixing them buries the answer. Measured on TradingAlertSystem,
        # which this resolver cites as its worked example: the combined form
        # returned FOUR commits, every one of them an edit to
        # .claude/commands/resolve-issue.md and none a consumer change — and
        # --no-patch shows only summaries, so they read like real history.
        #
        # SCOPE IT LIKE THE CONSUMER SEARCH: repo-wide minus prose, not a list of
        # source directories. The consumer field above is already repo-wide for
        # this reason and the history search lagged behind it — measured,
        # `pipeline-fast` is defined at Makefile:50 and NOTHING else, so the
        # directory list returned 0 commits and read as "it never had a
        # consumer", while repo-wide returns 1. Root-level executables
        # (Makefile, Dockerfiles, dependency manifests) are code.
        #
        # But ':!*.md' then hides the executable markdown, so agents and prompts
        # come back as their own scopes — measured, `code-reviewer` goes to 0
        # under the exclusion and 1 with .claude/agents searched separately.
        # Same three-scope shape the resolver's consumed() uses.
        $ git log --oneline --all --full-history --diff-merges=separate --no-patch \
            -G "<symbol>" --no-renames \
            -- . ':!docs/' ':!archive/' ':!gcp/research/_archive/' \
               ':!.github/ISSUE_TEMPLATE/' ':!.claude/commands/' ':!*.md' \
               ':!*.drawio' ':!tests/fixtures/live_gcp_snapshot_*.json' \
               ':!.github/workflows/logs.txt'
        # The generated artifacts belong here too, even though history is a
        # different question from consumers. -G matches the commit that WROTE
        # the artifact, and --no-patch hides which file matched, so it reads as
        # "the change that wired a real caller". Measured on fetch_market_data:
        # without them the top hit is c19ab32, a docs-refresh commit; restricted
        # to the snapshot fixture alone it still matches, and restricted to
        # everything else it does not appear at all.
        $ git log --oneline --all --full-history --diff-merges=separate --no-patch \
            -G "<symbol>" --no-renames -- .claude/agents .github/prompts CLAUDE.md
        <sha> (date) added it and wired it into <the caller>
        <sha> (date) rewrote that caller, silently dropping the mount

        # Then .claude/commands SEPARATELY. For a slash-command surface these ARE
        # its implementation history; for anything else they are this resolver's
        # own prose about the example. Read them knowing which you have.
        $ git log --oneline --all --full-history --diff-merges=separate --no-patch \
            -G "<symbol>" --no-renames -- .claude/commands

        The shape of a conclusive answer: the second commit enumerates the new code's
        contents and never mentions the removal. That reads as accidental rewrite debris
        rather than a deliberate retirement. Run it on YOUR surface — an example's shas
        are not evidence about the surface in your issue.

  - type: textarea
    id: options
    attributes:
      label: Options, with a recommendation
      description: Give the reader a decision and say which one you would take. If the surface is user-facing and stale, disabling the render ships today.
      placeholder: |
        - **Retire** — nobody noticed its absence for three months and the briefing-first
          dashboard has no slot for an ops widget. Recommended unless the next option is
          actually wanted.
        - **Restore** — if operators want this visibility back, decide where it mounts and
          add a fixture so E2E covers it.
    validations:
      required: true

  - type: textarea
    id: cost
    attributes:
      label: Cost of leaving it running
      description: >-
        For an unread writer, the compute is a live bill and the audit rows are
        false confidence. Estimate $/run x runs/day x 30 where a schedule fires.
        Write "n/a" for a pure code surface.
      placeholder: |
        Weekly regime-combination job: ~4 min at 4 CPU / 8Gi, weekly, ~$0.30/run x 4 = ~$1.20/mo.
        Small, but the audit table it writes has no reader, which is the part that misleads.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Retiring and restoring have different bars. Restoring needs a writer, a schedule, a freshness SLO and a consumer guard, not just a re-run.
      placeholder: |
        Retire: `git grep -qE "<name>" -- . ':!docs/' ':!archive/'
        ':!gcp/research/_archive/' ':!*.disabled' ':!.github/ISSUE_TEMPLATE/'
        ':!.claude/commands/' ':!*.md' ':!*.drawio'
        ':!tests/fixtures/live_gcp_snapshot_*.json'
        ':!.github/workflows/logs.txt'` returns 1 — and separately
        `.claude/agents/`, `.claude/commands/`, `.github/prompts/` and root
        `CLAUDE.md`, which are executable too: an agent delegated to by name, a
        command another command routes to, a prompt a workflow cats into Gemini,
        or an agent the auto-loaded project instructions name, is a
        live consumer that a prose-shaped exclusion hides — the same exclusions as the
        consumer field above, and repo-wide because
        .github/workflows/deploy-staging.yml:299 dispatches a job the four source dirs
        cannot see; AND the surface's own definition is gone, which no consumer
        search can tell you: every executable-markdown scope excludes the
        surface's own file so an agent does not match itself, and a module's
        contents need not contain its basename, so both come back "no consumers"
        with the implementation still on disk — measured on two dormant agents
        in this repo. Assert it on PATHS instead — and the assertion needs
        all four of these, each of which a shorter form gets wrong: anchored
        at the repo ROOT (from gcp/ a bare ls-files sees 171 paths, not 1330,
        and misses every root-level definition), over the WORKING TREE rather
        than the index (Phase 4 runs before anything is staged, so a deleted
        entry is still listed and holds the bar closed), skipping paths a
        retirement deliberately KEEPS (a fully retired workflow keeps its
        *.yml.disabled file by this repo's own convention, and archive/ holds
        code that is meant to stay), and with the listing's STATUS CHECKED —
        piped straight into grep, a failed inventory feeds it empty input, grep
        returns 1, and "no output" is indistinguishable from the passing answer:

          $ root=$(git rev-parse --show-toplevel) || echo "not in a checkout"
          $ files=$(git -C "$root" ls-files --cached --others --exclude-standard \
                      -- . ':!*.disabled' ':!archive/' ':!gcp/research/_archive/') \
              || echo "listing FAILED — assert nothing"
          $ printf '%s\n' "$files" |
              while IFS= read -r p; do
                test -n "$p" || continue
                test -e "$root/$p" || test -L "$root/$p" || continue
                printf '%s\n' "$p"; done |
              grep -E "<name>"
          (no output, and only after both commands above succeeded)

        `/resolve-issue`'s `absent_everywhere` runs exactly that, alongside the
        consumer searches, in both repos — prefer it to re-typing this; the
        schedule is deleted; the retention/export decision is recorded; the cost
        delta is measured.

        Restore: writer scheduled and in gcp/deploy.sh `all)`; an entry in
        scripts/audit_data_freshness.py with writer_job and min_rows_per_day; a max-age guard at
        the read boundary that fails loud; the table current, shown by the query re-run.
    validations:
      required: true

  - type: checkboxes
    id: attestation
    attributes:
      label: Evidence attestation
      description: >-
        Live state is read from the live system while filing. A surface that
        has no writer, schedule or execution history is filed with those marked
        n/a — see the top of this form.
      options:
        - label: >-
            Every piece of live state above was read from the live system while
            filing, and whatever this surface lacks is marked n/a, not guessed.
          required: true
        - label: >-
            The consumer search covered both repos, and I have said so if I
            checked source only rather than the deployed build.
          required: true
