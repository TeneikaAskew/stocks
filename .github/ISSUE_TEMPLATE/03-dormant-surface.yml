name: Dormant surface — retire or restore
description: A table, job, endpoint, or module that is unfed, unread, or unscheduled. Decide its fate on evidence.
title: "<surface>: <unfed | unread | unscheduled> — retire or restore?"
body:
  - type: markdown
    attributes:
      value: |
        For surfaces that are neither clearly alive nor clearly dead: a table
        nothing writes, a job nothing schedules, an endpoint nothing calls, a
        module whose consumers vanished in a rewrite.

        **"Nothing reads it" is a claim that has to be measured, in both repos.**
        The frontend lives in TeneikaAskew/solyra; a table with no Python
        consumer can still be rendered on a dashboard tile. `playbook_cards`
        looked dormant and was being served to the user as today's setups.

        **Distinguish "never scheduled" from "the writer failed".** They have
        different fixes and the failure history will not tell you which. The
        `phase6-playbook` job had six executions, all on one day in June, and no
        Cloud Scheduler entry at all. Reading the code would not have found
        that; `gcloud scheduler jobs list` did.

        **A code-only surface has no live state, and saying so is not a gap.**
        A module with no writer, no schedule and no execution history is filed
        with those fields marked n/a; the importer search is then the whole of
        the evidence. What is not acceptable is inventing a freshness number
        for a surface that has none.

        **The sample outputs in the placeholders are dated measurements, not
        current facts.** They show the shape of a conclusive answer. Re-run
        every one against the live system — the staleness figure in particular
        moves every day the writer stays broken.

  - type: input
    id: surface
    attributes:
      label: Surface
      description: The table, job, endpoint, or module, named exactly.
      placeholder: "playbook_cards (table) + phase6-playbook (Cloud Run Job)"
    validations:
      required: true

  - type: dropdown
    id: condition
    attributes:
      label: Condition
      options:
        - Unfed — consumers exist, writer stopped or never ran
        - Unread — writer runs on schedule, nothing consumes the output
        - Unscheduled — the job exists and is deployable but no scheduler fires it
        - Orphaned — neither written nor read
        - Never populated — created but has never held a row
    validations:
      required: true

  - type: textarea
    id: freshness-evidence
    attributes:
      label: Freshness and writer state, from the live system
      description: >-
        Query the data and read GCP. Not the docs: `docs/PIPELINE.md` was wrong
        about a schedule in two places. Paste command and output together.
      render: shell
      placeholder: |
        $ ./scripts/db_query_cr.sh -q "SELECT max(analysis_date), current_date - max(analysis_date), count(*) FROM playbook_cards"
        2026-06-13 | 85 | 36

        $ gcloud scheduler jobs list --location=us-east1 --filter="name~phase6"
        Listed 0 items.

        $ gcloud beta run jobs executions list --job=phase6-playbook --region=us-east1 --limit=10
        (six executions, all 2026-06-14)

        $ grep -n "phase6-playbook" gcp/deploy.sh
        (no _schedule entry; not in the all) target)
    validations:
      required: true

  - type: textarea
    id: consumers
    attributes:
      label: Consumers, measured in both repos
      description: >-
        Paste the searches. A surface is only dead when both sides come back
        empty. Say explicitly if you checked source only and not the deployed
        build.
      render: shell
      placeholder: |
        # Repo-wide over TRACKED files, not the five source directories — a job's
        # only caller is often a workflow. Measured:
        # .github/workflows/deploy-staging.yml:299 dispatches
        # refresh-earnings-views and the five-dir search misses it entirely.
        # ':!archive/' as well: archive/README.md says "Retired code ... Nothing
        # here runs in production", so a hit there is not a consumer. Measured —
        # TradingAlertSystem matches archive/standalone-scripts/trading_alerts.py
        # and nothing live, which would block a correct retirement.
        # ':!.github/ISSUE_TEMPLATE/' and ':!*.md' exclude PROSE, THIS FILE
        # INCLUDED. The line above names TradingAlertSystem, so without them the
        # search for it matches this comment and .claude/commands/resolve-issue.md
        # and returns rc=0 forever — measured, exactly those two hits and nothing
        # else. A retirement check whose passing state is unreachable is not a
        # check. Note ':!*.md' is what covers .claude/, NOT a ':!.claude/'
        # directory exclusion: .claude/settings.json is an executable hook, and
        # excluding the directory would hide a surface that hook consumes.
        # ':!*.drawio' and the live_gcp_snapshot fixture likewise: measured, the
        # three root .drawio diagrams and the GCP state capture they are drawn
        # from match six of seven probe surfaces and invoke none of them. Derive
        # this list, do not extend it per report — recipe in the resolver's
        # Phase 2. platform/api/openapi.json deliberately stays IN: it is
        # generated, so a retired route still named there means the snapshot was
        # not regenerated, which the check SHOULD catch.
        $ git grep -En "playbook_cards|/api/playbook" -- . ':!docs/' ':!archive/' ':!gcp/research/_archive/' ':!*.disabled' ':!.github/ISSUE_TEMPLATE/' ':!*.md' ':!*.drawio' ':!tests/fixtures/live_gcp_snapshot_*.json'
        (142 matching LINES across 13 files: router, writer, tests. Lines, not
        occurrences — `git grep -c`/`wc -l` count lines, and 7 of these carry
        both alternatives, so the pattern occurs 149 times. Use `git grep -Eo`
        if you mean occurrences; say which one your number is.)

        solyra: DashboardPage top setup tile (incl. review mode ?date=), PlaybookPage.
        Both live. So this is Tier 1: stale rows rendered as today's setups.
    validations:
      required: true

  - type: textarea
    id: forensics
    attributes:
      label: How it got here
      description: "Git forensics with dates and commits, via -G --no-renames (not -S). A surface dropped by an unrelated rewrite reads differently from one retired on purpose."
      render: shell
      placeholder: |
        # FIRST: is this clone shallow? If so every answer below is truncated at the
        # graft and there is NO warning — an empty result means "not in the window",
        # which is indistinguishable from "never had a consumer", the exact conclusion
        # this field exists to support. Measured: an unknown symbol returns empty with
        # rc=0, and the walk simply stops at the graft commit.
        $ git rev-parse --is-shallow-repository     # must print false
        $ git fetch --unshallow                     # if it printed true
        #
        # -G --no-renames --full-history, NOT -S. Measured: -S counts per blob, so a
        # rewritten import line inside ONE file leaves the count equal and -S skips
        # that commit; a pure rename is invisible to BOTH until --no-renames; and
        # default history simplification prunes side branches, so an importer that
        # lived only on a merged-and-deleted branch returns NOTHING until
        # --full-history (reproduced on git 2.43).
        #
        # The pathspec is THIS repo's source, and `--all` is not optional. `-- src
        # platform/src` is what this example was written against before the split and
        # it now covers nothing here: there is no src/, and platform/src left at #957.
        # Measured — under that pathspec `refresh-earnings-views`, `replay_signal_monitor`,
        # `_emergency_ceiling_block` and `db_query_cr` ALL return 0 commits, so the search
        # answers "never had a consumer" for every surface in the repo.
        # --diff-merges=separate as well: --full-history controls TRAVERSAL, not
        # whether merge diffs are SEARCHED. An importer introduced only by a manual
        # conflict resolution in a merge commit is invisible without it. Reproduced
        # on git 2.43.0 (solyra#63): without it the search returned only the commit
        # that REMOVED the importer; with it, the merge that added it appears too.
        # "Added by nobody, removed by someone" is the tell.
        # --no-patch as well, or this dumps a full diff against every merge
        # parent: measured on this repo, 12,981 lines for one symbol versus 9
        # with it. -G selection and the parent-qualified summaries are kept.
        $ git log --oneline --all --full-history --diff-merges=separate --no-patch \
            -G "<symbol>" --no-renames \
            -- lib gcp platform scripts .github tests
        <sha> (date) added it and wired it into <the caller>
        <sha> (date) rewrote that caller, silently dropping the mount

        The shape of a conclusive answer: the second commit enumerates the new code's
        contents and never mentions the removal. That reads as accidental rewrite debris
        rather than a deliberate retirement. Run it on YOUR surface — an example's shas
        are not evidence about the surface in your issue.

  - type: textarea
    id: options
    attributes:
      label: Options, with a recommendation
      description: Give the reader a decision and say which one you would take. If the surface is user-facing and stale, disabling the render ships today.
      placeholder: |
        - **Retire** — nobody noticed its absence for three months and the briefing-first
          dashboard has no slot for an ops widget. Recommended unless the next option is
          actually wanted.
        - **Restore** — if operators want this visibility back, decide where it mounts and
          add a fixture so E2E covers it.
    validations:
      required: true

  - type: textarea
    id: cost
    attributes:
      label: Cost of leaving it running
      description: >-
        For an unread writer, the compute is a live bill and the audit rows are
        false confidence. Estimate $/run x runs/day x 30 where a schedule fires.
        Write "n/a" for a pure code surface.
      placeholder: |
        Weekly regime-combination job: ~4 min at 4 CPU / 8Gi, weekly, ~$0.30/run x 4 = ~$1.20/mo.
        Small, but the audit table it writes has no reader, which is the part that misleads.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Retiring and restoring have different bars. Restoring needs a writer, a schedule, a freshness SLO and a consumer guard, not just a re-run.
      placeholder: |
        Retire: `git grep -q "<name>" -- . ':!docs/' ':!archive/'
        ':!gcp/research/_archive/' ':!*.disabled' ':!.github/ISSUE_TEMPLATE/'
        ':!*.md' ':!*.drawio' ':!tests/fixtures/live_gcp_snapshot_*.json'` returns 1 — the same exclusions as the
        consumer field above, and repo-wide because
        .github/workflows/deploy-staging.yml:299 dispatches a job the four source dirs
        cannot see; the schedule is deleted; the retention/export decision is recorded;
        the cost delta is measured.

        Restore: writer scheduled and in gcp/deploy.sh `all)`; an entry in
        scripts/audit_data_freshness.py with writer_job and min_rows_per_day; a max-age guard at
        the read boundary that fails loud; the table current, shown by the query re-run.
    validations:
      required: true

  - type: checkboxes
    id: attestation
    attributes:
      label: Evidence attestation
      description: >-
        Live state is read from the live system while filing. A surface that
        has no writer, schedule or execution history is filed with those marked
        n/a — see the top of this form.
      options:
        - label: >-
            Every piece of live state above was read from the live system while
            filing, and whatever this surface lacks is marked n/a, not guessed.
          required: true
        - label: >-
            The consumer search covered both repos, and I have said so if I
            checked source only rather than the deployed build.
          required: true
