name: Defect
description: Something is wrong in code, data, or infrastructure, and you can show it from the live system
title: "<area>: <what is wrong, stated as the defect not the symptom>"
body:
  - type: markdown
    attributes:
      value: |
        **Evidence comes from the system, not from memory.** CLAUDE.md Rule 3.11:
        a claim without evidence is a guess, and you must say which one it is.
        Every measurement below has to be produced by running something against
        the live system while filing this issue.

        Not evidence: a doc, a code comment, a number from an older issue, a
        plausible mechanism, or a recollection of a previous session.
        `docs/PIPELINE.md` said `fetch-market-data` runs "23:00 UTC daily"; the
        live scheduler is `0 23 * * 1-5 America/New_York`. The doc was cited as
        justification for a cache boundary, produced a wrong fix, and had to be
        corrected too.

        **A metric that stands in for what you care about needs spot-checking
        against a known case.** A coverage audit here reported 81 of 101 route
        handlers untested — it had counted handler function names while the
        suite drives URL paths. The real figure was 23.

        **The sample outputs in the placeholders are dated measurements, not
        current facts.** #861 was filed at 77 days stale and was 85 by the time
        work started — the drift was itself evidence about the writer. Re-run
        every command; a number copied out of a placeholder is a guess wearing
        a shell prompt.

        "I have not measured this" is a complete and acceptable answer. Write it
        where it applies rather than filling a section with a guess.

  - type: textarea
    id: summary
    attributes:
      label: Summary and provenance
      description: What is wrong, stated as the defect rather than the symptom. Then where it came from, and whether it is a regression.
      placeholder: |
        `lib/options_greeks.py::get_rate_and_yield` substitutes fixed risk-free and
        dividend rates on import, query, or missing-row failures, with no freshness
        gate. Gamma-flip computation consumes the same path.

        Provenance: found by Codex on #933 at commit 7b82f10. NOT a regression that
        PR introduced — daily_trades has had this property since long before it; the
        new ceilings inherit it. (#940 was split out of a review this way, rather
        than patched in place, because the fix exceeded that PR's scope.)
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence from the live system
      description: Command AND output together. Where you characterise a population, include the grouped counts, not MIN/MAX.
      render: shell
      placeholder: |
        $ ./scripts/db_query_cr.sh -q "SELECT max(analysis_date), current_date - max(analysis_date), count(*) FROM playbook_cards"
        2026-06-13 | 85 | 36

        $ gcloud scheduler jobs list --location=us-east1 --filter="name~phase6"
        Listed 0 items.

        # Characterising data? Show the distribution. An aggregate hid a second
        # timestamp convention in market_data_intraday and the conclusion had
        # to be reverted:
        $ ./scripts/db_query_cr.sh -q "SELECT extract(hour from ts) h, count(*), min(ts::date), max(ts::date) FROM market_data_intraday WHERE ticker='IWM' GROUP BY 1 ORDER BY 1"
        4 | 5636 | 2016-12-13 | 2026-09-04
        5 | 4887 | 2026-04-06 | 2026-09-04
    validations:
      required: true

  - type: textarea
    id: current-expected
    attributes:
      label: Current vs expected behaviour
      description: State both. "Expected" is what a correct system does, not what you wish it did.
      placeholder: |
        **Current:** the failure or missing value is replaced silently, and the caller
        cannot tell the substitute from a real result.
        **Expected:** invalid required input fails visibly; any allowed degradation is
        typed, observable, and carries provenance.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and blast radius
      description: >-
        Who consumes this surface. Establish it by grep, not by recollection,
        and check the frontend in TeneikaAskew/solyra too before calling a
        surface dead. Paste what you ran.
      render: shell
      placeholder: |
        # Repo-wide over TRACKED files, not the five source directories: CI is
        # where jobs are dispatched, and .github/ is outside them. Measured —
        # .github/workflows/deploy-staging.yml:299 runs
        # `gcloud run jobs execute refresh-earnings-views`, and the five-dir
        # search cannot see it.
        # ':!archive/' too: archive/ is retired code that does not run in
        # production, so a hit there is not a consumer.
        # ':!.github/ISSUE_TEMPLATE/', ':!.claude/commands/' and ':!*.md' exclude
        # the files that cite example symbols in their own prose, THIS ONE
        # INCLUDED — measured on TradingAlertSystem, rc=0 from this file and
        # .claude/commands/resolve-issue.md alone, so the search could never
        # reach "no consumers". Note this is NOT a rule about markdown or about
        # .claude/: both hold EXECUTABLE files here (.claude/settings.json is a
        # hook, .claude/agents/*.md are delegated to by name), and the resolver
        # searches those separately for exactly that reason.
        # Echo PIPESTATUS[0]. `wc` supplies the pipeline's exit status, so a
        # git grep that FAILED still prints a number and the pipeline exits 0 —
        # measured, a bad regex exits 128 on its own and 0 through the pipe,
        # which files as "no matches" instead of "the measurement broke". 0 is
        # a hit, 1 is a clean miss, anything else means the count is meaningless.
        # `wc -l` also counts matching LINES, not occurrences — a line with two
        # matches counts once. Say which you mean; `git grep -Eo` counts those.
        # ANCHOR AT THE REPO ROOT. `.` and the four Claude scopes are relative
        # to your CWD, and a pathspec that does not exist there is a CLEAN MISS
        # rather than an error. Measured from gcp/: all five searches below
        # return rc=1 for debug-workflow — "no consumers, dormant" — while the
        # root .claude/commands/ really does route to it.
        $ root=$(git rev-parse --show-toplevel)
        $ git -C "$root" grep -En "playbook_cards" -- . ':!docs/' ':!archive/' ':!gcp/research/_archive/' ':!*.disabled' ':!.github/ISSUE_TEMPLATE/' ':!.claude/commands/' ':!*.md' ':!*.drawio' ':!tests/fixtures/live_gcp_snapshot_*.json' ':!.github/workflows/logs.txt' | wc -l; echo "grep rc=${PIPESTATUS[0]}"
        107
        grep rc=0
        # AND the executable Claude scopes, which the search above excludes as
        # prose. .claude/agents/*.md and .claude/commands/*.md RUN — measured,
        # gcp-config-reviewer returns no matches above while
        # .claude/agents/pre-deploy-check.md:75 delegates to it on every deploy.
        # Exclude the surface's own definition file: an agent always matches
        # itself, which would make every agent look consumed.
        $ git -C "$root" grep -nE "<surface>" -- .claude/agents ':!.claude/agents/<surface>.md'
        $ git -C "$root" grep -nE "<surface>" -- .claude/commands ':!.claude/commands/<surface>.md'
        $ git -C "$root" grep -nE "<surface>" -- .github/prompts ':!.github/prompts/<surface>.md'
        $ git -C "$root" grep -nE "<surface>" -- CLAUDE.md
        CLAUDE.md is the SIXTH executable-markdown scope and the easiest to
        mistake for prose: Claude Code loads it automatically and it routes by
        name — `CLAUDE.md:502` and `:507` send sessions to fallback-guard and
        pre-deploy-check. Measured on fallback-guard with its code and agent
        callers simulated away: every other scope returns no matches while
        CLAUDE.md still routes to it. Root file only; docs/*.md stay prose.
        .github/prompts/*.md is the fourth executable-markdown scope:
        scripts/maintenance/render_doc_prompts.py renders them and
        refresh-architecture-docs.yml:537 cats the result into Gemini, so the
        source templates are markdown that ':!*.md' hides. Measured on
        verify_docs_against_live with its real consumers simulated away — code,
        agents and commands all return "no matches" while
        .github/prompts/architecture.md:80 names
        scripts/verify_docs_against_live.py as the gate the refresh must pass.
        A .claude/commands/ hit is AMBIGUOUS — a real route, or one of these
        forms quoting an example. Read the lines and say which. An agent or
        prompt hit is not ambiguous: both are consumers.

        Live consumers in solyra: DashboardPage top setup tile (incl. review mode ?date=), PlaybookPage.
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 (severity:critical) — fires wrong, loses money, or serves a lie now
        - P1 (severity:high) — decision-critical correctness, not currently firing
        - P2 (severity:medium) — architecture or parity, contained
        - P3 (severity:low) — cleanup, cost, maintainability
    validations:
      required: true

  - type: dropdown
    id: historical-impact
    attributes:
      label: Historical evidence impact
      description: >-
        What happens to artifacts already produced under the broken behaviour.
        Where provenance cannot identify them, choose UNKNOWN rather than
        assuming old evidence is clean.
      options:
        - NONE — no artifact was produced under the defect
        - RERUN — affected artifacts can be identified and recomputed
        - DISCARD AFFECTED RESULTS — outputs where the defect changed decisions
        - UNKNOWN — NEEDS ARTIFACT MAPPING
    validations:
      required: true

  - type: textarea
    id: remediation
    attributes:
      label: Proposed remediation direction
      description: Direction, not a patch. Boundary first, then writer, then class guard. "Do not fix" is a valid answer if the evidence supports it.
      placeholder: |
        1. Disable the render behind an explicit max-age contract that fails loud.
        2. Then diagnose the writer; the June stop is worth checking against deploy history.
        3. Add a freshness guard at the render layer regardless, so the next instance surfaces itself.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >-
        The bar this issue closes against. Make it something a run can prove.
        A regression test that fails against the unfixed code is the minimum.
      placeholder: |
        - A test reproducing the pure-put 0DTE case (gamma_flip = 424.5 at spot 600) that fails before the fix.
        - The production query re-run: zero flips >20% from spot, or every remaining one explained.
        - A decision recorded on the 54 historical rows (corrected or nulled).
    validations:
      required: true

  - type: checkboxes
    id: attestation
    attributes:
      label: Evidence attestation
      description: >-
        "Measured" is defined at the top of this form. An honestly unverified
        report is fine; an unmarked guess is not.
      options:
        - label: >-
            Everything presented above **as measured** was run against the live
            system now, and anything unverified is labelled as such.
          required: true
        - label: >-
            Where a metric stands in for the thing I actually care about, I
            spot-checked the stand-in against a known case.
          required: true
        - label: >-
            Where a code comment contradicts my measurement, I widened the
            measurement rather than overruling the comment.
          required: true
