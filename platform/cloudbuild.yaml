# Build context is the repo root; Dockerfile lives under platform/.
# Invoked via:
#   gcloud builds submit --config platform/cloudbuild.yaml \
#     --substitutions _IMAGE=...,_TAG=<short sha> .
#
# _TAG is an immutable per-build tag and is required. Building the bare
# `${_IMAGE}` meant `:latest`, which the OTHER staging deploy path (the
# deploy-solyra-api-staging Cloud Build trigger) writes too -- so two
# overlapping runs could push over each other between one run's push and its
# deploy. See the header of gcp/cloudbuild/deploy-solyra-api-staging-cloudbuild.yaml.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - platform/Dockerfile
      - --tag
      - ${_IMAGE}:${_TAG}
      - .
images:
  - ${_IMAGE}:${_TAG}
# Static, and deliberately not narrowed to staging: `gcloud builds submit` has
# no flag for build tags and this file serves both services, so the two deploy
# paths can only see each other through a tag that is in the file. The cost is
# that a prod deploy also blocks a concurrent staging deploy, which is
# conservative rather than wrong -- both are manual, and both publish into the
# same image repository. Read by
# gcp/cloudbuild/assert_no_concurrent_staging_deploy.sh.
tags: [solyra-api-image-build]
options:
  logging: CLOUD_LOGGING_ONLY
